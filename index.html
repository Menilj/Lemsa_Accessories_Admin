          <div class="amt">${amountPrefix}${fmtMoney(t.amount)}</div>
          <div class="bal">${balText}</div>
        </div>
        <div class="tx-actions">
          <button class="danger" data-del-sales="${t.id}" title="Delete"><i class="fas fa-trash"></i></button>
        </div>
      </div>`;
  }).join('');

  list.querySelectorAll('[data-del-sales]').forEach(b => b.onclick = (e) => { e.stopPropagation(); deleteSalesTransactionById(b.dataset.delSales); });
}
async function deleteSalesTransactionById(id) {
  const tx = salesTransactions.find(t => t.id === id);
  if (!tx) return;
  if (!confirm(`Delete this ${tx.type} of ${fmtMoney(tx.amount)}?\n\nThis will adjust the cash sales balance.`)) return;
  try {
    if (tx.type === 'sale') await runTransaction(ref(db, 'cashSales/balance'), (cur) => (cur || 0) - tx.amount);
    else if (tx.type === 'collect') await runTransaction(ref(db, 'cashSales/balance'), (cur) => (cur || 0) + tx.amount);
    await remove(ref(db, `cashSales/transactions/${id}`));
    toast('Cash sales transaction deleted', 'success');
  } catch (e) { toast('Failed: ' + e.message, 'error'); }
}

async function saveCashSales() {

  const notes = document.getElementById('cashSalesNotes').value.trim();

      previousBalance: +salesBalance.toFixed(2),

  } catch (e) {

  }

function openScanner(target) {
  scannerTarget = target || 'lookup';
  document.getElementById('scannerModal').classList.add('open');
  document.getElementById('manualBarcode').value = '';
  lastScannedCode = null; lastScannedAt = 0;
  const status = document.getElementById('scannerStatus');
  const titleEl = document.getElementById('scannerTitle');
  if (scannerTarget === 'add-product') titleEl.textContent = 'Scan Barcode for New Product';
  else if (scannerTarget === 'edit-product') titleEl.textContent = 'Scan Barcode for Edit';
  else if (scannerTarget === 'bulk-add') titleEl.textContent = 'Bulk Add Products';
  else titleEl.textContent = 'Scan Barcode';
  if (!window.ZXing) { status.textContent = '⚠️ Scanner library missing. Use manual entry.'; return; }
  scanner = new ZXing.BrowserMultiFormatReader();
  scannerActive = true;
  status.textContent = '🎥 Starting camera…';
  status.classList.remove('active');
  scanner.decodeFromVideoDevice(null, 'scannerVideo', (result, err) => {
    if (!scannerActive) return;
    if (result) {
      const code = result.getText();
      const now = Date.now();
      if (code === lastScannedCode && (now - lastScannedAt) < 2000) return;
      lastScannedCode = code; lastScannedAt = now;
      status.textContent = `✅ ${code}`; status.classList.add('active');
      beep(1200, 80); handleScannedCode(code);
    }
  }).catch(e => { status.textContent = '⚠️ Camera unavailable. Use manual entry below.'; });
}
function closeScanner() {
  document.getElementById('scannerModal').classList.remove('open');
  scannerActive = false;
  if (scanner) { try { scanner.reset(); } catch (e) {} scanner = null; }
  const video = document.getElementById('scannerVideo');
  if (video && video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
  document.getElementById('manualBarcode').value = '';
  document.getElementById('scannerStatus').classList.remove('active');
}
function handleScannedCode(code) {
  if (scannerTarget === 'add-product') {
    document.getElementById('newBarcode').value = code;
    toast('Barcode set: ' + code, 'success'); closeScanner();
    setTimeout(() => document.getElementById('newName').focus(), 300); return;
  }
  if (scannerTarget === 'edit-product') {
    document.getElementById('editBarcode').value = code;
    toast('Barcode set: ' + code, 'success'); closeScanner(); return;
  }
  if (scannerTarget === 'bulk-add') {
    const existing = products.find(p => p.barcode === code || p.id === code);
    if (existing) { toast(`Already exists: ${existing.name}`, 'warning'); return; }
    document.getElementById('newBarcode').value = code;
    document.getElementById('newName').value = '';
    document.getElementById('newPrice').value = '';
    document.getElementById('newStock').value = '0';
    toast('Barcode captured: ' + code, 'success'); closeScanner();
    switchView('inventory');
    setTimeout(() => { document.getElementById('newName').focus(); }, 200); return;
  }
  const product = products.find(p => p.barcode === code || p.id === code);
  if (product) {
    toast(`Found: ${product.name}`, 'success'); closeScanner();
    if (!document.querySelector('#view-inventory.active')) switchView('inventory');
    setTimeout(() => highlightProductRow(product.id), 200);
  } else {
    beep(300, 200);
    toast(`Not in inventory: ${code}`, 'warning');
  }
}
function highlightProductRow(productId) {
  const row = document.querySelector(`tr[data-product-id="${productId}"]`);
  if (!row) return;
  row.classList.add('row-highlight');
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  setTimeout(() => row.classList.remove('row-highlight'), 2200);
}

function renderAnalytics() {
  if (!document.getElementById('view-analytics')) return;
  const now = Date.now();
  const dayMs = 86400000;
  const rangeStart = now - analyticsRange * dayMs;
  const inRange = transactions.filter(t => (t.timestamp||0) >= rangeStart);

  const revenue = inRange.reduce((s,t) => s + (t.total||0), 0);
  const txCount = inRange.length;
  const avg = txCount > 0 ? revenue / txCount : 0;

  const floatInRange = floatTransactions.filter(t => (t.timestamp||0) >= rangeStart);
  const floatNet = floatInRange.reduce((s,t) => {
    if (t.type === 'in') return s + (t.amount||0);
    if (t.type === 'out' || t.type === 'sale') return s - (t.amount||0);
    return s;
  }, 0);

  const prevStart = rangeStart - analyticsRange * dayMs;
  const prev = transactions.filter(t => (t.timestamp||0) >= prevStart && (t.timestamp||0) < rangeStart);
  const prevRev = prev.reduce((s,t) => s + (t.total||0), 0);
  const revTrend = prevRev > 0 ? ((revenue - prevRev) / prevRev) * 100 : (revenue > 0 ? 100 : 0);

  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('anRevenue', fmtMoney(revenue));
  set('anTx', txCount);
  set('anTxSub', `${inRange.filter(t=>t.status==='completed').length} completed`);
  set('anAvg', fmtMoney(avg));
  set('anFloatNet', (floatNet>=0?'+':'') + fmtMoney(floatNet));
  set('anFloatNetSub', `${floatInRange.length} M-Pesa movements`);

  const revKpi = document.getElementById('anRevenueSub');
  if (revKpi) {
    const badge = revTrend >= 0
      ? `<span class="kpi-trend up"><i class="fas fa-arrow-up"></i>${Math.abs(revTrend).toFixed(1)}%</span>`
      : `<span class="kpi-trend down"><i class="fas fa-arrow-down"></i>${Math.abs(revTrend).toFixed(1)}%</span>`;
    revKpi.innerHTML = `${txCount} sales · ${badge}`;
  }

  renderAnalyticsRevenueChart(inRange);
  renderAnalyticsCategoryChart(inRange);
  renderTopProducts(inRange);
  renderPaymentMix(inRange);
  renderHeatStrip(inRange);
  renderAnalyticsFloatChart();
}
function renderAnalyticsRevenueChart(inRange) {
  const canvas = document.getElementById('anRevenueCanvas'); if (!canvas || typeof Chart === 'undefined') return;
  const buckets = analyticsRange <= 7 ? analyticsRange : (analyticsRange <= 30 ? 30 : 30);
  const step = analyticsRange <= 7 ? 1 : (analyticsRange <= 30 ? 1 : 3);
  const labels = []; const values = [];
  for (let i = buckets - 1; i >= 0; i -= step) {
    const start = new Date(); start.setHours(0,0,0,0); start.setDate(start.getDate() - i);
    const end = new Date(start); end.setDate(end.getDate() + step);

  analyticsRevenueChart = new Chart(ctx, {
    type:'line',
    data:{labels,datasets:[{label:'Revenue',data:values,borderColor:'#3b82f6',backgroundColor:grad,borderWidth:3,fill:true,tension:.4,pointBackgroundColor:'#60a5fa',pointBorderColor:'#0c1a33',pointBorderWidth:3,pointRadius:5,pointHoverRadius:7}]},

    labels.push(analyticsRange <= 7 ? start.toLocaleDateString('en', { weekday: 'short' }) : `${start.getDate()}/${start.getMonth()+1}`);
    const mLast = floatTransactions.filter(t => (t.timestamp||0) < end.getTime()).sort((a,b) => (b.timestamp||0) - (a.timestamp||0))[0];
    const cLast = cashTransactions.filter(t => (t.timestamp||0) < end.getTime()).sort((a,b) => (b.timestamp||0) - (a.timestamp||0))[0];
    const sLast = salesTransactions.filter(t => (t.timestamp||0) < end.getTime()).sort((a,b) => (b.timestamp||0) - (a.timestamp||0))[0];
    mpesaVals.push(mLast ? (mLast.balanceAfter || 0) : (i === days-1 ? floatBalance : 0));
    cashVals.push(cLast ? (cLast.balanceAfter || 0) : (i === days-1 ? cashBalance : 0));
    salesVals.push(sLast ? (sLast.balanceAfter || 0) : (i === days-1 ? salesBalance : 0));
  }
  if (analyticsFloatChart) analyticsFloatChart.destroy();
  const ctx = canvas.getContext('2d');
  analyticsFloatChart = new Chart(ctx, {
    type:'line',
    data:{
      labels,
      datasets:[
        { label:'M-Pesa Float', data:mpesaVals, borderColor:'#00a651', backgroundColor:'rgba(0,166,81,.08)', borderWidth:3, fill:true, tension:.4, pointBackgroundColor:'#4ade80', pointBorderColor:'#0c1a33', pointBorderWidth:3, pointRadius:4 },
        { label:'Cash Float', data:cashVals, borderColor:'#10b981', backgroundColor:'rgba(16,185,129,.06)', borderWidth:3, fill:true, tension:.4, pointBackgroundColor:'#34d399', pointBorderColor:'#0c1a33', pointBorderWidth:3, pointRadius:4 },
        { label:'Cash Sales', data:salesVals, borderColor:'#8b5cf6', backgroundColor:'rgba(139,92,246,.06)', borderWidth:3, fill:true, tension:.4, pointBackgroundColor:'#a78bfa', pointBorderColor:'#0c1a33', pointBorderWidth:3, pointRadius:4 }

function renderUsers() {
  const grid = document.getElementById('userGrid'); if (!grid) return;
  const entries = Object.entries(users).map(([uid, u]) => ({ uid, ...u }));
  const filtered = userFilter === 'all' ? entries : entries.filter(u => u.role === userFilter);
  const countEl = document.getElementById('userCountLabel');
  if (countEl) countEl.textContent = `${entries.length} user${entries.length !== 1 ? 's' : ''}`;
  const nav = document.getElementById('navUserCount');
  if (nav) nav.textContent = entries.length;
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><i class="fas fa-user-group"></i>No ${userFilter !== 'all' ? userFilter + 's' : 'users'} yet</div>`;
    return;
  }
  filtered.sort((a, b) => {
    if (a.role !== b.role) return a.role === 'admin' ? -1 : 1;
    return (a.name || '').localeCompare(b.name || '');
  });
  grid.innerHTML = filtered.map(u => {
    const inits = initials(u.name || u.email);
    const self = isSelf(u.uid);
    const txForUser = transactions.filter(t => t.staff === u.name || t.staffId === u.uid);
    const totalSales = txForUser.reduce((s, t) => s + (t.total || 0), 0);
    return `
      <div class="user-card-lg">
        ${self ? '<div class="you-tag">You</div>' : ''}
        <div class="top">
          <div class="avatar">${inits}</div>
          <div class="info"><h4>${escapeHtml(u.name || 'Unnamed')}</h4><p>${escapeHtml(u.email || u.uid.slice(0, 12) + '…')}</p></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="role-badge ${u.role === 'admin' ? 'admin' : 'staff'}">
            <i class="fas ${u.role === 'admin' ? 'fa-shield-halved' : 'fa-user-tie'}"></i> ${escapeHtml(u.role || 'staff')}
          </span>
          ${u.createdAt ? `<span style="font-size:.7rem;color:var(--text-muted)">Added ${timeAgo(u.createdAt)}</span>` : ''}
        </div>
        <div class="user-stats">
          <div class="s"><strong>${fmtMoney(totalSales)}</strong><span>Revenue</span></div>
          <div class="s"><strong>${txForUser.length}</strong><span>Sales</span></div>
        </div>
        <div class="user-actions">
          <button data-edit-user="${u.uid}"><i class="fas fa-pen"></i> Edit</button>
          ${!self ? `<button class="danger" data-del-user="${u.uid}"><i class="fas fa-trash"></i> Delete</button>` : ''}
        </div>
      </div>`;
  }).join('');
  grid.querySelectorAll('[data-edit-user]').forEach(b => b.onclick = () => openEditUser(b.dataset.editUser));
  grid.querySelectorAll('[data-del-user]').forEach(b => b.onclick = () => deleteUser(b.dataset.delUser));
}
async function createNewUser() {
  const name = document.getElementById('newUserName').value.trim();
  const email = document.getElementById('newUserEmail').value.trim();
  const role = document.getElementById('newUserRole').value;
  if (!name || !email) { toast('Fill all fields', 'warning'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('Invalid email format', 'warning'); return; }
  const dup = Object.values(users).find(u => (u.email || '').toLowerCase() === email.toLowerCase());
  if (dup) { toast(`Email already registered`, 'error'); return; }
  const btn = document.getElementById('confirmAddUser');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating…';
  try {
    const uid = email.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_' + Date.now().toString(36);
    await set(ref(db, `users/${uid}`), { name, email: email.toLowerCase().trim(), role, createdBy: currentUser.uid, createdAt: Date.now() });
    toast(`User "${name}" created — they can now sign in with Google`, 'success', 3500);
    document.getElementById('newUserName').value = '';
    document.getElementById('newUserEmail').value = '';
    document.getElementById('addUserModal').classList.remove('open');
  } catch (e) { toast('Failed: ' + e.message, 'error'); }
  finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> Create'; }
}
function openEditUser(uid) {
  const u = users[uid]; if (!u) return;
  activeEditUserId = uid;
  document.getElementById('editUserName').value = u.name || '';
  document.getElementById('editUserEmail').value = u.email || '';
  document.getElementById('editUserRole').value = u.role || 'staff';
  document.getElementById('editUserModal').classList.add('open');
}
async function saveEditUser() {
  if (!activeEditUserId) return;
  const name = document.getElementById('editUserName').value.trim();
  const role = document.getElementById('editUserRole').value;
  if (!name) { toast('Name required', 'warning'); return; }
  if (isSelf(activeEditUserId) && role !== 'admin') { toast("Can't demote yourself", 'warning'); return; }
  try {
    await update(ref(db, `users/${activeEditUserId}`), { name, role });
    toast('User updated', 'success');
    document.getElementById('editUserModal').classList.remove('open');
  } catch (e) { toast('Failed: ' + e.message, 'error'); }
}
async function deleteUser(uid) {
  const u = users[uid]; if (!u) return;
  if (isSelf(uid)) { toast("Can't delete yourself", 'warning'); return; }
  if (!confirm(`Delete "${u.name || u.email}"?\n\nThey will no longer be able to sign in.`)) return;
  try { await remove(ref(db, `users/${uid}`)); toast('User removed', 'success'); }
  catch (e) { toast('Failed: ' + e.message, 'error'); }
}

function exportCSV() {
  if (transactions.length === 0 && floatTransactions.length === 0 && cashTransactions.length === 0 && salesTransactions.length === 0) { toast('No data to export', 'warning'); return; }
  const rows = [['Date','Staff','Items','Total (KSh)','Currency','Status']];
  transactions.forEach(t => {
    rows.push([t.timestamp ? new Date(t.timestamp).toISOString() : '', t.staff || '', (t.items||[]).map(i => `${i.name} x${i.qty}`).join(' | '), (t.total||0).toFixed(2), 'KSh', t.status || 'completed']);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `electropos-sales-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(url);

  if (floatTransactions.length > 0) {
    const fRows = [['Date','Type','Amount','Reference','Notes','Staff','Balance After','Pair']];
    floatTransactions.forEach(t => { fRows.push([t.timestamp ? new Date(t.timestamp).toISOString() : '', t.type||'', (t.amount||0).toFixed(2), t.reference||'', t.notes||'', t.staff||'', (t.balanceAfter||0).toFixed(2), t.transferPairId||'']); });
    const fCsv = fRows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const fBlob = new Blob([fCsv], { type:'text/csv' });

    const fa = document.createElement('a'); fa.href = fUrl; fa.download = `electropos-mpesa-${new Date().toISOString().slice(0,10)}.csv`; fa.click();

  }
  if (cashTransactions.length > 0) {
    const cRows = [['Date','Type','Amount','Reference','Notes','Staff','Balance After','Pair']];
    cashTransactions.forEach(t => { cRows.push([t.timestamp ? new Date(t.timestamp).toISOString() : '', t.type||'', (t.amount||0).toFixed(2), t.reference||'', t.notes||'', t.staff||'', (t.balanceAfter||0).toFixed(2), t.transferPairId||'']); });
    const cCsv = cRows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const cBlob = new Blob([cCsv], { type:'text/csv' });
    const cUrl = URL.createObjectURL(cBlob);
    const ca = document.createElement('a'); ca.href = cUrl; ca.download = `electropos-cash-float-${new Date().toISOString().slice(0,10)}.csv`; ca.click();
    URL.revokeObjectURL(cUrl);
  }
  if (salesTransactions.length > 0) {
    const sRows = [['Date','Type','Amount','Notes','Staff','Balance After']];
    salesTransactions.forEach(t => { sRows.push([t.timestamp ? new Date(t.timestamp).toISOString() : '', t.type||'', (t.amount||0).toFixed(2), t.notes||'', t.staff||'', (t.balanceAfter||0).toFixed(2)]); });
    const sCsv = sRows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const sBlob = new Blob([sCsv], { type:'text/csv' });
    const sUrl = URL.createObjectURL(sBlob);
    const sa = document.createElement('a'); sa.href = sUrl; sa.download = `electropos-cash-sales-${new Date().toISOString().slice(0,10)}.csv`; sa.click();
    URL.revokeObjectURL(sUrl);
  }
  toast('CSV exported', 'success');
}
function importCSV() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.csv,text/csv';
  input.onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const text = await file.text();
    const lines = text.split('\n').filter(l => l.trim());
    if (lines.length < 2) { toast('Empty CSV', 'warning'); return; }
    let imported = 0;
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g) || [];
      const clean = cols.map(c => c.replace(/^"|"$/g, '').trim());
      if (clean.length < 3) continue;
      const type = clean[1] || 'in';
      const amount = parseFloat(clean[2]);
      if (isNaN(amount)) continue;
      try {
        await set(push(ref(db, 'mpesaFloat/transactions')), { type, amount, reference: clean[3]||'', notes: clean[4]||'', staff: currentUser.name, staffId: currentUser.uid, balanceAfter: floatBalance, timestamp: Date.now() });
        imported++;
      } catch (err) { console.warn(err); }
    }
    toast(`Imported ${imported} float transactions`, 'success');
  };
  input.click();
}

/* ============================================================
   AUTH + REALTIME
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
  console.log('[Auth] state:', user ? user.email : 'signed out');
  if (authHandlerRunning) { console.log('[Auth] handler already running — skipping'); return; }
  authHandlerRunning = true;
  try {
    if (!user) {
      shellRendered = false;
      currentUser = null;
      products = []; transactions = []; users = {};
      floatTransactions = []; floatBalance = 0;
      cashTransactions = []; cashBalance = 0;
      salesTransactions = []; salesBalance = 0;
      clearAuthIntent();
      renderLogin('');
      return;
    }
    clearAuthIntent();

    let isAdmin = false;
    let userName = user.displayName || user.email.split('@')[0];

    try {
      const snap = await get(ref(db, 'users'));
      const allUsers = snap.val() || {};
      users = allUsers;
      const myEntry = Object.entries(allUsers).find(([uid, u]) => u && u.email && u.email.toLowerCase().trim() === (user.email || '').toLowerCase().trim());
      const emailIsBootstrapAdmin = BOOTSTRAP_ADMINS.map(e => e.toLowerCase().trim()).includes((user.email || '').toLowerCase().trim());
      const dbRole = myEntry ? myEntry[1].role : null;
      if (dbRole === 'admin' || emailIsBootstrapAdmin) {
        isAdmin = true;
        if (myEntry && myEntry[1].name) userName = myEntry[1].name;
      }
    } catch (e) {
      console.error('[Auth] Role check failed:', e);
      const emailIsBootstrapAdmin = BOOTSTRAP_ADMINS.map(e => e.toLowerCase().trim()).includes((user.email || '').toLowerCase().trim());
      if (emailIsBootstrapAdmin) isAdmin = true;
    }

    if (!isAdmin) {
      await signOut(auth);
      renderLogin(`"${user.email}" is not an admin account.`);
      return;
    }

    currentUser = { uid: user.uid, email: user.email, name: userName, role: 'admin', photoURL: user.photoURL || null };

    if (!shellRendered) {
      shellRendered = true;
      try { renderShell(); console.log('✅ Shell rendered for', currentUser.email); }
      catch (e) {
        console.error('Shell crash:', e);
        renderFatal('Admin Console Crashed', 'Refresh to retry.', e.message);
        return;
      }

      onValue(ref(db, 'products'), (s) => {
        const data = s.val() || {};
        products = Object.entries(data).map(([id, val]) => ({ id, ...val }));
        if (shellRendered) { renderProducts(); renderStats(); }
      });
      onValue(ref(db, 'transactions'), (s) => {
        const data = s.val() || {};
        transactions = Object.entries(data).map(([id, val]) => {
          let ts = val.timestamp;
          if (ts && typeof ts === 'object' && ts['.sv'] === 'timestamp') ts = Date.now();
          return { id, ...val, timestamp: ts || Date.now() };
        }).sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
        if (shellRendered) {
          renderTransactions(); renderStats(); renderStaff();
          if (document.querySelector('#view-analytics.active')) renderAnalytics();
          if (document.querySelector('#view-users.active')) renderUsers();
        }
      });
      onValue(ref(db, 'users'), (s) => {
        users = s.val() || {};
        if (shellRendered && document.querySelector('#view-users')) renderUsers();
      });
      onValue(ref(db, 'mpesaFloat/balance'), (s) => {
        floatBalance = s.val() || 0;
        if (shellRendered) { updateFloatDisplay(); if (document.querySelector('#view-analytics.active')) renderAnalytics(); }
      });
      onValue(ref(db, 'mpesaFloat/transactions'), (s) => {
        const data = s.val() || {};
        floatTransactions = Object.entries(data).map(([id, val]) => ({ id, ...val })).sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
        if (shellRendered) {
          renderFloatTransactions(); updateFloatDisplay();
          if (document.querySelector('#view-float.active') && activeFloatTab === 'mpesa') initFloatTrendChart();
          if (document.querySelector('#view-analytics.active')) renderAnalytics();
        }
      });
      onValue(ref(db, 'mpesaFloat/settings'), (s) => {
        const settings = s.val() || {};
        if (settings.lowThreshold) floatLowThreshold = settings.lowThreshold;
        if (shellRendered) updateFloatDisplay();
      });
      onValue(ref(db, 'cashFloat/balance'), (s) => {
        cashBalance = s.val() || 0;
        if (shellRendered) { updateCashDisplay(); if (document.querySelector('#view-analytics.active')) renderAnalytics(); }
      });
      onValue(ref(db, 'cashFloat/transactions'), (s) => {
        const data = s.val() || {};
        cashTransactions = Object.entries(data).map(([id, val]) => ({ id, ...val })).sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
        if (shellRendered) {
          renderCashTransactions(); updateCashDisplay();
          if (document.querySelector('#view-float.active') && activeFloatTab === 'cash') initCashTrendChart();
          if (document.querySelector('#view-analytics.active')) renderAnalytics();
        }
      });
      onValue(ref(db, 'cashFloat/settings'), (s) => {
        const settings = s.val() || {};
        if (settings.lowThreshold) cashLowThreshold = settings.lowThreshold;
        if (shellRendered) updateCashDisplay();
      });
      onValue(ref(db, 'cashSales/balance'), (s) => {
        salesBalance = s.val() || 0;
        if (shellRendered) { updateSalesDisplay(); if (document.querySelector('#view-analytics.active')) renderAnalytics(); }
      });
      onValue(ref(db, 'cashSales/transactions'), (s) => {
        const data = s.val() || {};
        salesTransactions = Object.entries(data).map(([id, val]) => ({ id, ...val })).sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
        if (shellRendered) {
          renderSalesTransactions(); updateSalesDisplay();
          if (document.querySelector('#view-float.active') && activeFloatTab === 'sales') initSalesTrendChart();
          if (document.querySelector('#view-analytics.active')) renderAnalytics();
        }
      });
      onValue(ref(db, 'cashSales/settings'), (s) => {
        const settings = s.val() || {};
        if (shellRendered && settings) { /* future use */ }
      });
    }
  } catch (e) {
    console.error('[Auth] handler crashed:', e);
  } finally {
    setTimeout(() => { authHandlerRunning = false; }, 500);
  }
});
</script>
</body>
</html>
