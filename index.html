/* ============================================================
   TRANSACTIONS
   ============================================================ */
function renderTransactions() {
  const now = Date.now(); const dayMs = 86400000;
  let filtered = transactions;
  if (txFilter === 'today') { const s = new Date(); s.setHours(0,0,0,0); filtered = transactions.filter(t => (t.timestamp||0) >= s.getTime()); }
  else if (txFilter === 'week') filtered = transactions.filter(t => (t.timestamp||0) >= now - 7*dayMs);
  else if (txFilter === 'month') filtered = transactions.filter(t => (t.timestamp||0) >= now - 30*dayMs);

  const nav = document.getElementById('navTxCount');
  if (nav) nav.textContent = transactions.length;
  const countEl = document.getElementById('txCount');
  if (countEl) countEl.textContent = filtered.length + ' record' + (filtered.length !== 1 ? 's' : '');

  const htmlFull = filtered.length === 0
    ? `<div class="empty"><i class="fas fa-receipt"></i>No transactions</div>`
    : filtered.map(t => {
        const when = t.timestamp ? timeAgo(t.timestamp) : 'just now';
        const itemCount = (t.items||[]).reduce((s,i) => s + (i.qty||1), 0);
        const names = (t.items||[]).slice(0,2).map(i=>i.name).join(', ') + ((t.items||[]).length > 2 ? '…' : '');
        return `
          <div class="tx-row" data-tx="${t.id}">
            <div class="tx-left"><div class="tx-icon"><i class="fas fa-receipt"></i></div>
              <div class="tx-detail"><h4>${itemCount} item${itemCount!==1?'s':''} · ${escapeHtml(t.staff||'Staff')}</h4><p>${when}${names ? ' · ' + escapeHtml(names) : ''}</p></div>
            </div>
            <div class="tx-right"><div class="amount">${fmtMoney(t.total)}</div><div class="status">${escapeHtml(t.status||'completed')}</div></div>
          </div>`;
      }).join('');

  const dashList = document.getElementById('txListDash');
  const fullList = document.getElementById('txListFull');
  if (dashList) {
    dashList.innerHTML = transactions.length === 0
      ? `<div class="empty"><i class="fas fa-receipt"></i>No transactions yet</div>`
      : transactions.slice(0, 6).map(t => {
          const when = t.timestamp ? timeAgo(t.timestamp) : 'just now';
          const itemCount = (t.items||[]).reduce((s,i) => s + (i.qty||1), 0);
          return `<div class="tx-row" data-tx="${t.id}"><div class="tx-left"><div class="tx-icon"><i class="fas fa-receipt"></i></div><div class="tx-detail"><h4>${itemCount} item${itemCount!==1?'s':''} · ${escapeHtml(t.staff||'Staff')}</h4><p>${when}</p></div></div><div class="tx-right"><div class="amount">${fmtMoney(t.total)}</div></div></div>`;
        }).join('');
  }
  if (fullList) fullList.innerHTML = htmlFull;

  document.querySelectorAll('[data-tx]').forEach(row => {
    row.onclick = () => {
      const tx = transactions.find(t => t.id === row.dataset.tx);
      if (tx) openEditTransaction(tx);
    };
  });
}

function openEditTransaction(tx) {
  activeEditTxId = tx.id;
  document.getElementById('editTxStaff').value = tx.staff || '';
  document.getElementById('editTxPayment').value = tx.paymentMethod || 'cash';
  document.getElementById('editTxStatus').value = tx.status || 'completed';
  document.getElementById('editTxDiscount').value = tx.discount || 0;
  document.getElementById('editTxTax').value = tx.tax || 0;
  document.getElementById('editTxNotes').value = tx.notes || '';
  document.getElementById('editTxModal').classList.add('open');
}

async function saveEditTransaction() {
  if (!activeEditTxId) return;
  const staff = document.getElementById('editTxStaff').value.trim();
  const paymentMethod = document.getElementById('editTxPayment').value;
  const status = document.getElementById('editTxStatus').value;
  const discount = parseFloat(document.getElementById('editTxDiscount').value) || 0;
  const tax = parseFloat(document.getElementById('editTxTax').value) || 0;
  const notes = document.getElementById('editTxNotes').value.trim();
  if (!staff) { toast('Staff name required', 'warning'); return; }
  try {
    await update(ref(db, `transactions/${activeEditTxId}`), {
      staff, paymentMethod, status, discount, tax, notes,
      updatedAt: Date.now(), updatedBy: currentUser.name
    });
    toast('Transaction updated', 'success');
    document.getElementById('editTxModal').classList.remove('open');
    activeEditTxId = null;
  } catch (e) { toast('Failed: ' + e.message, 'error'); }
}

async function deleteTransaction() {
  if (!activeEditTxId) return;
  if (!confirm('Delete this transaction permanently?')) return;
  try {
    await remove(ref(db, `transactions/${activeEditTxId}`));
    toast('Transaction deleted', 'success');
    document.getElementById('editTxModal').classList.remove('open');
    activeEditTxId = null;
  } catch (e) { toast('Failed: ' + e.message, 'error'); }
}

/* ============================================================
   STATS / ANALYTICS / STAFF
   ============================================================ */
function renderStats() {
  const totalSales = transactions.reduce((s,t) => s + (t.total||0), 0);
  const count = transactions.length;
  const avg = count > 0 ? totalSales / count : 0;
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  set('statSales', fmtMoney(totalSales));
  set('statTx', count);
  set('statProducts', products.length);
  set('statAvg', fmtMoney(avg));
  updateFloatDisplay();
}

function renderAnalytics() {
  const now = Date.now(); const dayMs = 86400000;
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const today = transactions.filter(t => (t.timestamp||0) >= todayStart.getTime());
  const week = transactions.filter(t => (t.timestamp||0) >= now - 7*dayMs);
  const month = transactions.filter(t => (t.timestamp||0) >= now - 30*dayMs);
  const sum = arr => arr.reduce((s,t) => s + (t.total||0), 0);
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  set('anToday', fmtMoney(sum(today))); set('anTodayCount', today.length + ' sales');
  set('anWeek', fmtMoney(sum(week))); set('anWeekCount', week.length + ' sales');
  set('anMonth', fmtMoney(sum(month))); set('anMonthCount', month.length + ' sales');
  const counts = {};
  transactions.forEach(t => (t.items||[]).forEach(i => { counts[i.name] = (counts[i.name]||0) + (i.qty||1); }));
  const top = Object.entries(counts).sort((a,b) => b[1]-a[1])[0];
  set('anTopProduct', top ? top[0] : '—');
  set('anTopProductCount', top ? `${top[1]} sold` : 'No data');
}

function renderStaff() {
  const list = document.getElementById('staffList');
  if (!list) return;
  const stats = {};
  transactions.forEach(t => {
    const name = t.staff || 'Unknown';
    if (!stats[name]) stats[name] = { name, count: 0, total: 0, lastAt: 0 };
    stats[name].count += 1;
    stats[name].total += t.total || 0;
    stats[name].lastAt = Math.max(stats[name].lastAt, t.timestamp || 0);
  });
  const arr = Object.values(stats).sort((a,b) => b.total - a.total);
  if (arr.length === 0) { list.innerHTML = `<div class="empty"><i class="fas fa-user-tie"></i>No staff sales yet</div>`; return; }
  list.innerHTML = arr.map(s => `
    <div class="user-card-lg" style="margin-bottom:10px;flex-direction:row;align-items:center;gap:16px">
      <div class="avatar">${initials(s.name)}</div>
      <div style="flex:1">
        <h4 style="font-size:.95rem;font-weight:800">${escapeHtml(s.name)}</h4>
        <p style="font-size:.75rem;color:var(--text-muted)">Last sale: ${s.lastAt ? timeAgo(s.lastAt) : '—'}</p>
      </div>
      <div style="text-align:right">
        <strong style="font-size:1.2rem;font-weight:800;color:var(--accent-bright)">${fmtMoney(s.total)}</strong>
        <div style="font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-weight:700">${s.count} sale${s.count!==1?'s':''}</div>
      </div>
    </div>`).join('');
}

/* ============================================================
   USERS
   ============================================================ */
function renderUsers() {
  const grid = document.getElementById('userGrid');
  if (!grid) return;

  const entries = Object.entries(users).map(([uid, u]) => ({ uid, ...u }));
  const filtered = userFilter === 'all' ? entries : entries.filter(u => u.role === userFilter);

  const countEl = document.getElementById('userCountLabel');
  if (countEl) countEl.textContent = `${entries.length} user${entries.length !== 1 ? 's' : ''}`;
  const nav = document.getElementById('navUserCount');
  if (nav) nav.textContent = entries.length;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><i class="fas fa-user-group"></i>No ${userFilter !== 'all' ? userFilter + 's' : 'users'} yet</div>`;
    return;
  }

  filtered.sort((a, b) => {
    if (a.role !== b.role) return a.role === 'admin' ? -1 : 1;
    return (a.name || '').localeCompare(b.name || '');
  });

  grid.innerHTML = filtered.map(u => {
    const inits = initials(u.name || u.email);
    const self = isSelf(u.uid);
    const txForUser = transactions.filter(t => t.staff === u.name || t.staffId === u.uid);
    const totalSales = txForUser.reduce((s, t) => s + (t.total || 0), 0);

    return `
      <div class="user-card-lg">
        ${self ? '<div class="you-tag">You</div>' : ''}
        <div class="top">
          <div class="avatar">${inits}</div>
          <div class="info">
            <h4>${escapeHtml(u.name || 'Unnamed')}</h4>
            <p>${escapeHtml(u.email || u.uid.slice(0, 12) + '…')}</p>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="role-badge ${u.role === 'admin' ? 'admin' : 'staff'}">
            <i class="fas ${u.role === 'admin' ? 'fa-shield-halved' : 'fa-user-tie'}"></i> ${escapeHtml(u.role || 'staff')}
          </span>
          ${u.createdAt ? `<span style="font-size:.7rem;color:var(--text-muted)">Added ${timeAgo(u.createdAt)}</span>` : ''}
        </div>
        <div class="user-stats">
          <div class="s"><strong>${fmtMoney(totalSales)}</strong><span>Revenue</span></div>
          <div class="s"><strong>${txForUser.length}</strong><span>Sales</span></div>
        </div>
        <div class="user-actions">
          <button data-edit-user="${u.uid}"><i class="fas fa-pen"></i> Edit</button>
          ${!self ? `<button class="danger" data-del-user="${u.uid}"><i class="fas fa-trash"></i> Delete</button>` : ''}
        </div>
      </div>`;
  }).join('');

  grid.querySelectorAll('[data-edit-user]').forEach(b => b.onclick = () => openEditUser(b.dataset.editUser));
  grid.querySelectorAll('[data-del-user]').forEach(b => b.onclick = () => deleteUser(b.dataset.delUser));
}

async function createNewUser() {
  const name = document.getElementById('newUserName').value.trim();
  const email = document.getElementById('newUserEmail').value.trim();
  const role = document.getElementById('newUserRole').value;

  if (!name || !email) { toast('Fill all fields', 'warning'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('Invalid email format', 'warning'); return; }
  const dup = Object.values(users).find(u => (u.email || '').toLowerCase() === email.toLowerCase());
  if (dup) { toast(`Email already registered`, 'error'); return; }

  const btn = document.getElementById('confirmAddUser');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating…';

  try {
    const uid = email.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_' + Date.now().toString(36);
    await set(ref(db, `users/${uid}`), {
      name, email: email.toLowerCase().trim(), role,
      createdBy: currentUser.uid, createdAt: Date.now()
    });
    toast(`User "${name}" created — they can now sign in with Google`, 'success', 3500);
    document.getElementById('newUserName').value = '';
    document.getElementById('newUserEmail').value = '';
    document.getElementById('addUserModal').classList.remove('open');
  } catch (e) {
    console.error(e);
    toast('Failed: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check"></i> Create';
  }
}

function openEditUser(uid) {
  const u = users[uid];
  if (!u) return;
  activeEditUserId = uid;
  document.getElementById('editUserName').value = u.name || '';
  document.getElementById('editUserEmail').value = u.email || '';
  document.getElementById('editUserRole').value = u.role || 'staff';
  document.getElementById('editUserModal').classList.add('open');
}

async function saveEditUser() {
  if (!activeEditUserId) return;
  const name = document.getElementById('editUserName').value.trim();
  const role = document.getElementById('editUserRole').value;
  if (!name) { toast('Name required', 'warning'); return; }
  if (isSelf(activeEditUserId) && role !== 'admin') { toast("Can't demote yourself", 'warning'); return; }
  try {
    await update(ref(db, `users/${activeEditUserId}`), { name, role });
    toast('User updated', 'success');
    document.getElementById('editUserModal').classList.remove('open');
  } catch (e) { toast('Failed: ' + e.message, 'error'); }
}

async function deleteUser(uid) {
  const u = users[uid];
  if (!u) return;
  if (isSelf(uid)) { toast("Can't delete yourself", 'warning'); return; }
  if (!confirm(`Delete "${u.name || u.email}"?\n\nThey will no longer be able to sign in.`)) return;
  try {
    await remove(ref(db, `users/${uid}`));
    toast('User removed', 'success');
  } catch (e) { toast('Failed: ' + e.message, 'error'); }
}

/* ============================================================
   CHARTS
   ============================================================ */
function initChart() {
  const canvas = document.getElementById('salesChartCanvas');
  if (!canvas || typeof Chart === 'undefined') return;
  const labels = []; const values = [];
  for (let i = 6; i >= 0; i--) {
    const start = new Date(); start.setHours(0,0,0,0); start.setDate(start.getDate() - i);
    const end = new Date(start); end.setDate(end.getDate() + 1);
    labels.push(start.toLocaleDateString('en', { weekday: 'short' }));
    values.push(+transactions.filter(t => (t.timestamp||0) >= start.getTime() && (t.timestamp||0) < end.getTime()).reduce((s,t) => s + (t.total||0), 0).toFixed(2));
  }
  if (salesChart) salesChart.destroy();
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,280);
  grad.addColorStop(0,'rgba(59,130,246,.45)'); grad.addColorStop(1,'rgba(59,130,246,0)');
  salesChart = new Chart(ctx, {
    type:'line',
    data:{labels,datasets:[{label:'Revenue',data:values,borderColor:'#3b82f6',backgroundColor:grad,borderWidth:3,fill:true,tension:.4,pointBackgroundColor:'#60a5fa',pointBorderColor:'#0c1a33',pointBorderWidth:3,pointRadius:5,pointHoverRadius:7}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#0c1a33',borderColor:'#3b82f6',borderWidth:1,padding:12,callbacks:{label:c=>'  '+fmtMoney(c.parsed.y)}}},scales:{x:{grid:{display:false},ticks:{color:'#64748b',font:{size:11,weight:'600'}}},y:{grid:{color:'rgba(59,130,246,.08)'},ticks:{color:'#64748b',font:{size:11,weight:'600'},callback:v=>'KSh '+v}}}}
  });
}

function initCategoryChart() {
  const canvas = document.getElementById('categoryChartCanvas');
  if (!canvas || typeof Chart === 'undefined') return;
  const catTotals = {};
  transactions.forEach(t => (t.items||[]).forEach(i => {
    const p = products.find(x => x.id === i.productId);
    const cat = p?.category || 'other';
    catTotals[cat] = (catTotals[cat]||0) + (i.price * i.qty);
  }));
  const labels = Object.keys(catTotals); const data = Object.values(catTotals);
  const colors = ['#3b82f6','#22d3ee','#8b5cf6','#10b981','#f59e0b'];
  if (window.__catChart) window.__catChart.destroy();
  window.__catChart = new Chart(canvas.getContext('2d'), {
    type:'doughnut',
    data:{labels:labels.length?labels:['No data'],datasets:[{data:data.length?data:[1],backgroundColor:labels.length?colors.slice(0,labels.length):['#1e3a5f'],borderColor:'#0c1a33',borderWidth:4,hoverOffset:8}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'bottom',labels:{color:'#94a3b8',padding:16,font:{size:12,weight:'600'},usePointStyle:true,pointStyle:'circle'}},tooltip:{backgroundColor:'#0c1a33',borderColor:'#3b82f6',borderWidth:1,padding:12,callbacks:{label:c=>'  '+c.label+': '+fmtMoney(c.parsed)}}}}
  });
}

function initFloatTrendChart() {
  const canvas = document.getElementById('floatTrendCanvas');
  if (!canvas || typeof Chart === 'undefined') return;
  const labels = []; const values = [];
  for (let i = 6; i >= 0; i--) {
    const start = new Date(); start.setHours(0,0,0,0); start.setDate(start.getDate() - i);
    const end = new Date(start); end.setDate(end.getDate() + 1);
    labels.push(start.toLocaleDateString('en', { weekday: 'short' }));

  if (floatChart) floatChart.destroy();

  const grad = ctx.createLinearGradient(0,0,0,220);
  grad.addColorStop(0,'rgba(0,166,81,.45)'); grad.addColorStop(1,'rgba(0,166,81,0)');
  floatChart = new Chart(ctx, {
    type:'line',

    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#0c1a33',borderColor:'#00a651',borderWidth:1,padding:12,callbacks:{label:c=>'  '+fmtMoney(c.parsed.y)}}},scales:{x:{grid:{display:false},ticks:{color:'#64748b',font:{size:11,weight:'600'}}},y:{grid:{color:'rgba(0,166,81,.08)'},ticks:{color:'#64748b',font:{size:11,weight:'600'},callback:v=>'KSh '+v}}}}
  });
}

/* ============================================================
   CSV EXPORT / IMPORT
   ============================================================ */
function exportCSV() {
  if (transactions.length === 0 && floatTransactions.length === 0) { toast('No data to export', 'warning'); return; }
  const rows = [['Date','Staff','Items','Total (KSh)','Currency','Status']];
  transactions.forEach(t => {
    rows.push([
      t.timestamp ? new Date(t.timestamp).toISOString() : '',
      t.staff || '',
      (t.items||[]).map(i => `${i.name} x${i.qty}`).join(' | '),
      (t.total||0).toFixed(2), 'KSh', t.status || 'completed'
    ]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `electropos-sales-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);

  if (floatTransactions.length > 0) {
    const fRows = [['Date','Type','Amount (KSh)','Reference','Phone','Notes','Staff','Balance After']];
    floatTransactions.forEach(t => {
      fRows.push([
        t.timestamp ? new Date(t.timestamp).toISOString() : '',
        t.type || '', (t.amount||0).toFixed(2),
        t.reference || '', t.phone || '', t.notes || '',
        t.staff || '', (t.balanceAfter||0).toFixed(2)
      ]);
    });
    const fCsv = fRows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    const fBlob = new Blob([fCsv], { type:'text/csv' });
    const fUrl = URL.createObjectURL(fBlob);
    const fa = document.createElement('a');
    fa.href = fUrl;
    fa.download = `electropos-mpesa-float-${new Date().toISOString().slice(0,10)}.csv`;
    fa.click();
    URL.revokeObjectURL(fUrl);
  }
  toast('CSV exported', 'success');
}

function importCSV() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv,text/csv';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const lines = text.split('\n').filter(l => l.trim());
    if (lines.length < 2) { toast('Empty CSV', 'warning'); return; }
    let imported = 0;
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g) || [];
      const clean = cols.map(c => c.replace(/^"|"$/g, '').trim());
      if (clean.length < 3) continue;
      const type = clean[1] || 'in';
      const amount = parseFloat(clean[2]);
      if (isNaN(amount)) continue;
      try {
        await set(push(ref(db, 'mpesaFloat/transactions')), {
          type, amount,
          reference: clean[3] || '',
          phone: clean[4] || '',
          notes: clean[5] || '',
          staff: currentUser.name, staffId: currentUser.uid,
          balanceAfter: floatBalance, timestamp: Date.now()
        });
        imported++;
      } catch (err) { console.warn(err); }
    }
    toast(`Imported ${imported} float transactions`, 'success');
  };
  input.click();
}

/* ============================================================
   AUTH STATE
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
  console.log('[Auth] state:', user ? user.email : 'signed out');
  if (authHandlerRunning) { console.log('[Auth] handler already running — skipping'); return; }
  authHandlerRunning = true;

  try {
    if (!user) {
      shellRendered = false;
      currentUser = null;
      products = []; transactions = []; users = {}; floatTransactions = []; floatBalance = 0;
      // Only show login if we're not in the middle of a redirect
      if (!hasAuthIntent()) {
        renderLogin('');
      } else {
        // We have an auth intent but no user — the redirect may have failed
        console.log('⚠️ Auth intent present but no user — showing retry login');
        renderLogin('Sign-in was interrupted. Please try again.');
      }
      return;
    }

    clearAuthIntent();
    let isAdmin = false;
    let userName = user.displayName || user.email.split('@')[0];

    try {
      const snap = await get(ref(db, 'users'));
      const allUsers = snap.val() || {};
      users = allUsers;
      const myEntry = Object.entries(allUsers).find(([uid, u]) =>
        u && u.email && u.email.toLowerCase().trim() === (user.email || '').toLowerCase().trim()
      );
      const emailIsBootstrapAdmin = BOOTSTRAP_ADMINS
        .map(e => e.toLowerCase().trim())
        .includes((user.email || '').toLowerCase().trim());
      const dbRole = myEntry ? myEntry[1].role : null;
      if (dbRole === 'admin' || emailIsBootstrapAdmin) {
        isAdmin = true;
        if (myEntry && myEntry[1].name) userName = myEntry[1].name;
      }
    } catch (e) {
      console.error('[Auth] Role check failed:', e);
      const emailIsBootstrapAdmin = BOOTSTRAP_ADMINS
        .map(e => e.toLowerCase().trim())
        .includes((user.email || '').toLowerCase().trim());
      if (emailIsBootstrapAdmin) isAdmin = true;
    }

    if (!isAdmin) {
      console.warn('[Auth] Not an admin — signing out');
      await signOut(auth);
      renderLogin(`"${user.email}" is not an admin account.`);
      return;
    }

    currentUser = {
      uid: user.uid, email: user.email, name: userName,
      role: 'admin', photoURL: user.photoURL || null
    };

    if (!shellRendered) {
      shellRendered = true;
      try {
        renderShell();
        console.log('✅ Shell rendered for', currentUser.email);
      } catch (e) {
        console.error('Shell crash:', e);
        renderFatal('Admin Console Crashed', 'Refresh to retry.', e.message);
        return;
      }

      onValue(ref(db, 'products'), (s) => {
        const data = s.val() || {};
        products = Object.entries(data).map(([id, val]) => ({ id, ...val }));
        if (shellRendered) { renderProducts(); renderStats(); }
      });

      onValue(ref(db, 'transactions'), (s) => {
        const data = s.val() || {};
        transactions = Object.entries(data).map(([id, val]) => {
          let ts = val.timestamp;
          if (ts && typeof ts === 'object' && ts['.sv'] === 'timestamp') ts = Date.now();
          return { id, ...val, timestamp: ts || Date.now() };
        }).sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
        if (shellRendered) {
          renderTransactions(); renderStats(); renderAnalytics(); renderStaff();
          if (document.querySelector('#view-users.active')) renderUsers();
        }
      });

      onValue(ref(db, 'users'), (s) => {
        users = s.val() || {};
        if (shellRendered && document.querySelector('#view-users')) renderUsers();
      });

      onValue(ref(db, 'mpesaFloat/balance'), (s) => {
        floatBalance = s.val() || 0;
        if (shellRendered) updateFloatDisplay();
      });

      onValue(ref(db, 'mpesaFloat/transactions'), (s) => {
        const data = s.val() || {};
        floatTransactions = Object.entries(data).map(([id, val]) => ({ id, ...val }))
          .sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
        if (shellRendered) {
          renderFloatTransactions();
          updateFloatDisplay();
          if (document.querySelector('#view-float.active')) initFloatTrendChart();
        }
      });

      onValue(ref(db, 'mpesaFloat/settings'), (s) => {
        const settings = s.val() || {};
        if (settings.lowThreshold) floatLowThreshold = settings.lowThreshold;
        if (shellRendered) updateFloatDisplay();
      });
    }
  } catch (e) {
    console.error('[Auth] handler crashed:', e);
  } finally {
    setTimeout(() => { authHandlerRunning = false; }, 500);
  }
});
</script>
