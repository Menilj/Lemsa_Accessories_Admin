      z-index: 9999;

<style>
:root{
  --bg-deep:#050d1c;--bg-primary:#081226;--bg-secondary:#0c1a33;--bg-tertiary:#112340;--bg-elevated:#162d4d;
  --bg-glass:rgba(12,26,51,.72);--border-subtle:rgba(59,130,246,.12);--border-strong:rgba(59,130,246,.28);--border-glass:rgba(147,197,253,.15);
  --accent:#3b82f6;--accent-hover:#2563eb;--accent-bright:#60a5fa;--accent-soft:rgba(59,130,246,.12);--accent-glow:rgba(59,130,246,.45);
  --cyan:#22d3ee;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--purple:#8b5cf6;
  --mpesa:#00a651;--mpesa-light:#4ade80;--mpesa-dark:#007a3d;
  --cash:#10b981;--cash-light:#34d399;--cash-dark:#047857;
  --sales:#8b5cf6;--sales-light:#a78bfa;--sales-dark:#6d28d9;
  --text-primary:#f8fafc;--text-secondary:#94a3b8;--text-muted:#64748b;
  --radius-sm:10px;--radius-md:14px;--radius-lg:20px;--radius-xl:28px;--radius-pill:100px;
  --shadow-md:0 8px 32px rgba(0,0,0,.4);--shadow-lg:0 24px 60px rgba(0,0,0,.55);--shadow-glow:0 0 24px var(--accent-glow);
  --sidebar-w:250px;--header-h:72px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-deep);color:var(--text-primary);font-size:14.5px;line-height:1.5;min-height:100vh;overflow-x:hidden;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);padding-left:var(--safe-left);padding-right:var(--safe-right);overscroll-behavior-y:none}
#app{min-height:100vh;display:flex;flex-direction:column;background:var(--bg-primary);position:relative}
#app::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 800px 600px at 0% 0%,rgba(59,130,246,.10),transparent 60%),radial-gradient(ellipse 700px 500px at 100% 100%,rgba(34,211,238,.06),transparent 60%)}

.loading-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:var(--bg-primary);z-index:9999}
.loading-spinner{width:56px;height:56px;border:3px solid var(--bg-tertiary);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;box-shadow:0 0 30px var(--accent-glow)}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen p{color:var(--text-secondary);font-size:.9rem;letter-spacing:.8px;text-transform:uppercase;font-weight:600}
.fatal-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg-primary)}
.fatal-card{max-width:560px;background:var(--bg-secondary);border:1px solid rgba(239,68,68,.4);border-radius:var(--radius-xl);padding:32px}
.fatal-card .icon{font-size:2.5rem;margin-bottom:14px}
.fatal-card h2{font-size:1.3rem;font-weight:800;margin-bottom:10px;color:var(--danger)}
.fatal-card p{color:var(--text-secondary);font-size:.9rem;margin-bottom:16px;line-height:1.6}
.fatal-card pre{background:var(--bg-tertiary);border-radius:var(--radius-md);padding:14px;color:var(--warning);font-size:.78rem;overflow:auto;white-space:pre-wrap;max-height:260px;font-family:'JetBrains Mono',monospace;margin-bottom:16px}
.fatal-card button{padding:12px 22px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-md);font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem}

.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 0%,rgba(59,130,246,.18),transparent 55%),radial-gradient(circle at 80% 100%,rgba(139,92,246,.10),transparent 55%),var(--bg-primary);position:relative;overflow:hidden}
.login-card{width:100%;max-width:420px;background:var(--bg-glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border-glass);border-radius:var(--radius-xl);padding:44px 32px;box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,.06);display:flex;flex-direction:column;gap:16px;animation:slideUp .5s cubic-bezier(.2,.8,.2,1);position:relative;z-index:1}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.login-card .brand-icon{width:72px;height:72px;margin:0 auto;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;box-shadow:var(--shadow-glow)}
.login-card h1{text-align:center;font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#fff 30%,var(--accent-bright));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-card .subtitle{text-align:center;color:var(--text-muted);font-size:.72rem;letter-spacing:2.5px;text-transform:uppercase;margin-top:-8px;margin-bottom:8px;font-weight:700}
.google-btn{width:100%;padding:16px;background:#fff;color:#1f1f1f;border:none;border-radius:var(--radius-md);font-size:1rem;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:12px;min-height:52px;box-shadow:0 4px 16px rgba(0,0,0,.25);letter-spacing:.2px}
.google-btn:hover{background:#f8f8f8;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.google-btn:active{transform:scale(.97)}
.google-btn:disabled{opacity:.7;cursor:not-allowed}
.google-btn svg{width:22px;height:22px;flex-shrink:0}
.login-error{color:var(--danger);font-size:.82rem;text-align:center;min-height:20px;font-weight:600;line-height:1.5}
.login-hint{text-align:center;font-size:.78rem;color:var(--text-muted);margin-top:8px;line-height:1.55}
.login-diagnostic{background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px;font-size:.72rem;color:var(--text-muted);line-height:1.6;margin-top:8px}
.login-diagnostic strong{color:var(--accent-bright)}

.app-shell{flex:1;display:flex;min-height:0;position:relative;z-index:1}
.sidebar{width:var(--sidebar-w);background:var(--bg-secondary);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;padding:20px 14px;flex-shrink:0;transition:transform .3s;position:relative;z-index:100;overflow-y:auto}
.sidebar::before{content:'';position:absolute;top:0;right:0;width:1px;height:100%;background:linear-gradient(180deg,transparent,var(--accent-glow),transparent)}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:8px 8px 24px;border-bottom:1px solid var(--border-subtle);margin-bottom:20px}
.sidebar-logo{width:42px;height:42px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:var(--shadow-glow);flex-shrink:0}
.sidebar-brand-text h1{font-size:1.05rem;font-weight:800;color:var(--text-primary)}
.sidebar-brand-text span{font-size:.62rem;color:var(--text-muted);letter-spacing:1.8px;text-transform:uppercase;font-weight:600}
.nav-group{margin-bottom:20px}
.nav-label{font-size:.65rem;color:var(--text-muted);letter-spacing:1.8px;text-transform:uppercase;font-weight:700;padding:0 12px 8px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius-md);color:var(--text-secondary);font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s;position:relative;border:none;background:transparent;width:100%;text-align:left;font-family:inherit}
.nav-item i{width:20px;text-align:center;font-size:.95rem}
.nav-item:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.nav-item.active{background:linear-gradient(90deg,var(--accent-soft),transparent);color:var(--accent-bright)}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-item .nav-badge{margin-left:auto;background:var(--accent-soft);color:var(--accent-bright);padding:2px 8px;border-radius:var(--radius-pill);font-size:.7rem;font-weight:700}
.nav-item.mpesa.active{background:linear-gradient(90deg,rgba(0,166,81,.15),transparent);color:var(--mpesa-light)}
.nav-item.mpesa.active::before{background:var(--mpesa)}
.nav-item.mpesa .nav-badge{background:rgba(0,166,81,.15);color:var(--mpesa-light)}
.sidebar-footer{margin-top:auto;padding-top:20px;border-top:1px solid var(--border-subtle)}
.user-card{display:flex;align-items:center;gap:12px;padding:10px;background:var(--bg-tertiary);border-radius:var(--radius-md);border:1px solid var(--border-subtle);margin-bottom:10px}
.user-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-info{flex:1;min-width:0}
.user-info h4{font-size:.82rem;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-info p{font-size:.68rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout-btn{width:100%;padding:11px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-secondary);font-size:.82rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;font-family:inherit}
.logout-btn:hover{background:rgba(239,68,68,.15);color:var(--danger)}

.main-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--bg-glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border-subtle);flex-shrink:0;gap:16px;position:relative;z-index:50}
.topbar-left{display:flex;align-items:center;gap:16px;min-width:0}
.menu-toggle{display:none;background:var(--bg-tertiary);border:1px solid var(--border-subtle);width:40px;height:40px;border-radius:var(--radius-md);color:var(--text-secondary);font-size:1rem;cursor:pointer;align-items:center;justify-content:center}
.page-title h2{font-size:1.15rem;font-weight:800;color:var(--text-primary)}
.page-title p{font-size:.75rem;color:var(--text-muted);margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:10px}
.live-pill{display:flex;align-items:center;gap:7px;padding:7px 14px;background:rgba(16,185,129,.10);border:1px solid rgba(16,185,129,.25);border-radius:var(--radius-pill);color:var(--success);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

.float-pills{display:flex;align-items:center;gap:8px}
.float-pill{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:var(--radius-pill);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;border:1px solid}
.float-pill.mpesa{background:linear-gradient(135deg,rgba(0,166,81,.18),rgba(0,166,81,.08));border-color:rgba(0,166,81,.3);color:var(--mpesa-light)}
.float-pill.cash{background:linear-gradient(135deg,rgba(16,185,129,.18),rgba(16,185,129,.08));border-color:rgba(16,185,129,.3);color:var(--cash-light)}
.float-pill.sales{background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(139,92,246,.08));border-color:rgba(139,92,246,.3);color:var(--sales-light)}
.float-pill::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);transition:left .5s}
.float-pill:hover::before{left:100%}
.float-pill:hover{transform:translateY(-1px)}
.float-pill.mpesa:hover{box-shadow:0 4px 16px rgba(0,166,81,.35)}
.float-pill.cash:hover{box-shadow:0 4px 16px rgba(16,185,129,.35)}
.float-pill.sales:hover{box-shadow:0 4px 16px rgba(139,92,246,.35)}
.float-pill i{font-size:.85rem}
.float-pill .pulse-dot{width:6px;height:6px;border-radius:50%;animation:blink 2s infinite}
.float-pill.mpesa .pulse-dot{background:var(--mpesa-light);box-shadow:0 0 8px var(--mpesa-light)}
.float-pill.cash .pulse-dot{background:var(--cash-light);box-shadow:0 0 8px var(--cash-light)}
.float-pill.sales .pulse-dot{background:var(--sales-light);box-shadow:0 0 8px var(--sales-light)}

.content{flex:1;overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:24px;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px}
.view{display:none;flex-direction:column;gap:24px;animation:fadeIn .25s}
.view.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.stat-card{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:22px;position:relative;overflow:hidden;transition:all .25s}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--cyan),transparent);opacity:.7}
.stat-card.mpesa::before{background:linear-gradient(90deg,var(--mpesa),var(--mpesa-light),transparent)}
.stat-card.cash::before{background:linear-gradient(90deg,var(--cash),var(--cash-light),transparent)}
.stat-card.sales::before{background:linear-gradient(90deg,var(--sales),var(--sales-light),transparent)}
.stat-card:hover{border-color:var(--border-strong);transform:translateY(-3px);box-shadow:var(--shadow-md)}
.stat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.stat-icon{width:46px;height:46px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:1.15rem}
.stat-icon.blue{background:var(--accent-soft);color:var(--accent-bright)}
.stat-icon.cyan{background:rgba(34,211,238,.12);color:var(--cyan)}
.stat-icon.purple{background:rgba(139,92,246,.12);color:var(--purple)}
.stat-icon.green{background:rgba(16,185,129,.12);color:var(--success)}
.stat-icon.mpesa{background:rgba(0,166,81,.15);color:var(--mpesa-light)}
.stat-icon.cash{background:rgba(16,185,129,.15);color:var(--cash-light)}
.stat-icon.sales{background:rgba(139,92,246,.15);color:var(--sales-light)}
.stat-trend{display:flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:var(--radius-pill)}
.stat-trend.up{background:rgba(16,185,129,.12);color:var(--success)}
.stat-trend.down{background:rgba(239,68,68,.12);color:var(--danger)}
.stat-label{color:var(--text-muted);font-size:.7rem;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;margin-bottom:8px}
.stat-value{color:var(--text-primary);font-size:2rem;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.stat-sub{color:var(--text-muted);font-size:.75rem;margin-top:8px}

.panel{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:22px;overflow:hidden}
.panel.mpesa{border-color:rgba(0,166,81,.25)}
.panel.cash{border-color:rgba(16,185,129,.25)}
.panel.sales{border-color:rgba(139,92,246,.25)}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.panel-title{display:flex;align-items:center;gap:12px}
.panel-title-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent-bright);font-size:.95rem}
.panel-title-icon.mpesa{background:rgba(0,166,81,.15);color:var(--mpesa-light)}
.panel-title-icon.cash{background:rgba(16,185,129,.15);color:var(--cash-light)}
.panel-title-icon.sales{background:rgba(139,92,246,.15);color:var(--sales-light)}
.panel-title h3{font-size:1rem;font-weight:800;color:var(--text-primary)}
.panel-title p{font-size:.72rem;color:var(--text-muted);margin-top:1px}
.panel-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.filter-tabs{display:flex;gap:4px;background:var(--bg-tertiary);padding:4px;border-radius:var(--radius-pill);border:1px solid var(--border-subtle)}
.filter-tab{padding:7px 16px;border-radius:var(--radius-pill);font-size:.75rem;font-weight:700;color:var(--text-secondary);cursor:pointer;transition:all .15s;background:transparent;border:none;font-family:inherit;white-space:nowrap}
.filter-tab.active{background:var(--accent);color:#fff;box-shadow:0 0 14px var(--accent-glow)}
.filter-tab.mpesa.active{background:var(--mpesa);box-shadow:0 0 14px rgba(0,166,81,.5)}
.filter-tab.cash.active{background:var(--cash);box-shadow:0 0 14px rgba(16,185,129,.5)}
.filter-tab.sales.active{background:var(--sales);box-shadow:0 0 14px rgba(139,92,246,.5)}

.tx-list{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow-y:auto;padding-right:4px;-webkit-overflow-scrolling:touch}
.tx-list::-webkit-scrollbar{width:5px}
.tx-list::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px}
.tx-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);gap:14px;transition:all .18s;position:relative;cursor:pointer}
.tx-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--cyan));opacity:.8}
.tx-row:hover{background:var(--bg-elevated);border-color:var(--border-strong);transform:translateX(3px)}
.tx-left{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.tx-icon{width:42px;height:42px;border-radius:var(--radius-md);background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent-bright);font-size:1rem;flex-shrink:0}
.tx-detail{min-width:0;flex:1}
.tx-detail h4{font-size:.88rem;color:var(--text-primary);font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-detail p{font-size:.72rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-right{text-align:right;flex-shrink:0}
.tx-right .amount{font-size:1.05rem;font-weight:800;color:var(--accent-bright);font-variant-numeric:tabular-nums}
.tx-right .status{font-size:.65rem;color:var(--success);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-top:3px}
.empty{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:.88rem}
.empty i{font-size:2.8rem;opacity:.25;display:block;margin-bottom:16px}

.chart-wrap{position:relative;height:280px;width:100%}

.add-form{display:grid;grid-template-columns:1fr 160px 200px auto;gap:12px}
.field{position:relative}
.field label{position:absolute;top:-8px;left:14px;background:var(--bg-secondary);padding:0 6px;font-size:.65rem;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;pointer-events:none;z-index:1}
.add-form input,.add-form select{padding:14px 16px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-primary);font-size:.9rem;outline:none;transition:all .2s;font-family:inherit;width:100%}
.add-form input:focus,.add-form select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.add-form input::placeholder{color:var(--text-muted)}
.btn-primary{padding:14px 24px;background:linear-gradient(135deg,var(--accent),var(--accent-hover));color:#fff;border:none;border-radius:var(--radius-md);font-weight:700;cursor:pointer;font-size:.9rem;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;box-shadow:var(--shadow-glow);font-family:inherit}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-primary.mpesa{background:linear-gradient(135deg,var(--mpesa),var(--mpesa-dark));box-shadow:0 0 24px rgba(0,166,81,.5)}
.btn-primary.cash{background:linear-gradient(135deg,var(--cash),var(--cash-dark));box-shadow:0 0 24px rgba(16,185,129,.5)}
.btn-primary.sales{background:linear-gradient(135deg,var(--sales),var(--sales-dark));box-shadow:0 0 24px rgba(139,92,246,.5)}
.btn-primary.danger{background:linear-gradient(135deg,var(--danger),#dc2626);box-shadow:0 0 24px rgba(239,68,68,.4)}
.btn-secondary{padding:12px 20px;background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);font-weight:700;cursor:pointer;font-size:.85rem;transition:all .2s;display:inline-flex;align-items:center;gap:8px;font-family:inherit}
.btn-secondary:hover{background:var(--bg-elevated);color:var(--accent-bright);border-color:var(--border-strong)}
.btn-secondary.mpesa:hover{color:var(--mpesa-light);border-color:rgba(0,166,81,.4)}
.btn-secondary.cash:hover{color:var(--cash-light);border-color:rgba(16,185,129,.4)}
.btn-secondary.sales:hover{color:var(--sales-light);border-color:rgba(139,92,246,.4)}
.btn-secondary.danger:hover{color:var(--danger);border-color:rgba(239,68,68,.4)}

.table-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px;-webkit-overflow-scrolling:touch}
.inv-table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:750px}
.inv-table th{text-align:left;padding:12px 14px;color:var(--text-muted);font-size:.68rem;text-transform:uppercase;letter-spacing:1.4px;font-weight:800;border-bottom:1px solid var(--border-subtle);white-space:nowrap}
.inv-table td{padding:15px 14px;border-bottom:1px solid var(--border-subtle);color:var(--text-secondary);vertical-align:middle}
.inv-table tr:last-child td{border-bottom:none}
.inv-table tbody tr{transition:background .15s}
.inv-table tbody tr:hover td{background:var(--bg-tertiary)}
.inv-table td.name{color:var(--text-primary);font-weight:700}
.inv-table td.price{color:var(--accent-bright);font-weight:800;font-variant-numeric:tabular-nums}
.cat-tag{display:inline-block;padding:4px 11px;background:var(--accent-soft);color:var(--accent-bright);border-radius:var(--radius-pill);font-size:.68rem;font-weight:700;text-transform:capitalize}
.stock-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--radius-pill);font-size:.7rem;font-weight:700}
.stock-pill.ok{background:rgba(16,185,129,.12);color:var(--success)}
.stock-pill.low{background:rgba(245,158,11,.12);color:var(--warning)}
.stock-pill.out{background:rgba(239,68,68,.12);color:var(--danger)}
.icon-btn-sm{width:34px;height:34px;border-radius:9px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);color:var(--text-secondary);cursor:pointer;font-size:.8rem;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;margin-left:6px}
.icon-btn-sm:hover{background:var(--bg-elevated);color:var(--accent-bright);border-color:var(--border-strong)}
.icon-btn-sm.danger:hover{background:rgba(239,68,68,.15);color:var(--danger)}

@keyframes highlightRow{0%{background:rgba(16,185,129,.4)}100%{background:transparent}}
.row-highlight td{animation:highlightRow 2s ease-out}

.modal-overlay{position:fixed;inset:0;background:rgba(5,13,28,.88);backdrop-filter:blur(10px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s;overscroll-behavior:contain}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:560px;background:var(--bg-secondary);border:1px solid var(--border-strong);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg),0 0 60px var(--accent-glow);overflow:hidden;transform:scale(.95);transition:transform .25s;display:flex;flex-direction:column;max-height:90vh}
.modal.mpesa{border-color:rgba(0,166,81,.4);box-shadow:var(--shadow-lg),0 0 60px rgba(0,166,81,.4)}
.modal.cash{border-color:rgba(16,185,129,.4);box-shadow:var(--shadow-lg),0 0 60px rgba(16,185,129,.4)}
.modal.sales{border-color:rgba(139,92,246,.4);box-shadow:var(--shadow-lg),0 0 60px rgba(139,92,246,.4)}
.modal.wide{max-width:820px}
.modal-overlay.open .modal{transform:scale(1)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border-subtle);background:var(--bg-tertiary);flex-shrink:0}
.modal-header h3{font-size:1rem;font-weight:800;display:flex;align-items:center;gap:10px;color:var(--text-primary)}
.modal-header h3 i{color:var(--accent-bright)}
.modal-header h3 i.mpesa{color:var(--mpesa-light)}
.modal-header h3 i.cash{color:var(--cash-light)}
.modal-header h3 i.sales{color:var(--sales-light)}
.close-btn{width:34px;height:34px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border-subtle);color:var(--text-secondary);cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
.close-btn:hover{background:rgba(239,68,68,.15);color:var(--danger)}
.modal-body{padding:22px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-footer{padding:16px 22px;border-top:1px solid var(--border-subtle);display:flex;justify-content:flex-end;gap:10px;background:var(--bg-tertiary);flex-shrink:0}

.scanner-viewport{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:var(--radius-lg);overflow:hidden;border:2px solid var(--accent);box-shadow:0 0 40px var(--accent-glow)}
#scannerVideo{width:100%;height:100%;object-fit:cover}
.scanner-overlay{position:absolute;inset:0;pointer-events:none}
.scanner-overlay::before{content:'';position:absolute;left:15%;right:15%;height:2px;background:linear-gradient(90deg,transparent,var(--accent-bright),transparent);box-shadow:0 0 12px var(--accent-glow);animation:scanLine 2s ease-in-out infinite}
@keyframes scanLine{0%,100%{top:30%;opacity:.3}50%{top:70%;opacity:1}}
.scanner-corners{position:absolute;width:70%;height:50%;top:25%;left:15%;border:2px solid var(--accent-bright);border-radius:14px;box-shadow:inset 0 0 40px rgba(59,130,246,.3),0 0 24px var(--accent-glow)}
.scanner-status{text-align:center;color:var(--text-secondary);font-size:.9rem;font-weight:700;padding:8px;min-height:24px}
.scanner-status.active{color:var(--success)}
.scanner-manual{display:flex;gap:8px}
.scanner-manual input{flex:1;padding:13px 16px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-primary);font-size:.9rem;outline:none;font-family:'JetBrains Mono',monospace;letter-spacing:1px}
.scanner-manual input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.scanner-manual button{padding:13px 20px;background:var(--accent);border:none;border-radius:var(--radius-md);color:#fff;font-weight:700;cursor:pointer;font-size:.85rem;font-family:inherit}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.form-field{position:relative}
.form-field label{position:absolute;top:-8px;left:14px;background:var(--bg-secondary);padding:0 6px;font-size:.65rem;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;z-index:1}
.form-field input,.form-field select,.form-field textarea{padding:14px 16px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-primary);font-size:.9rem;outline:none;width:100%;font-family:inherit;transition:all .2s}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.form-field input::placeholder,.form-field textarea::placeholder{color:var(--text-muted)}
.form-field textarea{resize:vertical;min-height:70px}

.stock-display{display:flex;align-items:center;justify-content:center;gap:20px;padding:20px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);margin-bottom:12px}
.stock-display .current,.stock-display .preview{text-align:center;flex:1}
.stock-display .current span,.stock-display .preview span{display:block;font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.4px;font-weight:700;margin-bottom:6px}
.stock-display .current strong{font-size:2.5rem;font-weight:800;color:var(--accent-bright);font-variant-numeric:tabular-nums}
.stock-display .preview strong{font-size:2.5rem;font-weight:800;color:var(--success);font-variant-numeric:tabular-nums}
.stock-display .arrow{color:var(--text-muted);font-size:1.5rem}
.stock-controls{display:flex;gap:8px;margin-bottom:12px}
.stock-controls input{flex:1;padding:14px 16px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-primary);font-size:1rem;font-weight:700;text-align:center;outline:none;font-family:'JetBrains Mono',monospace}
.stock-history{max-height:200px;overflow-y:auto;padding:4px;-webkit-overflow-scrolling:touch}
.stock-history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg-tertiary);border-radius:var(--radius-sm);margin-bottom:6px;font-size:.8rem}
.stock-history-item .change{font-weight:800;font-family:'JetBrains Mono',monospace}
.stock-history-item .change.pos{color:var(--success)}
.stock-history-item .change.neg{color:var(--danger)}
.stock-history-item .meta{font-size:.7rem;color:var(--text-muted)}

.label-preview{background:#fff;padding:20px;border-radius:var(--radius-md);text-align:center;color:#000;display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px}
.label-preview .label-name{font-size:.85rem;font-weight:700;color:#000}
.label-preview .label-price{font-size:1.1rem;font-weight:800;color:#000}
.label-controls{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.label-controls label{font-size:.8rem;color:var(--text-secondary);font-weight:600}
.label-controls input{padding:8px 12px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);color:var(--text-primary);font-size:.85rem;width:80px;font-family:inherit}
.receipt-paper{background:#fff;color:#000;padding:24px;border-radius:var(--radius-md);font-family:'JetBrains Mono',monospace;font-size:.8rem;max-width:380px;margin:0 auto;line-height:1.6}
.receipt-paper h2{text-align:center;font-size:1.1rem;margin-bottom:4px;font-weight:800}
.receipt-paper .center{text-align:center}
.receipt-paper .divider{border-top:1px dashed #000;margin:10px 0}
.receipt-paper .row{display:flex;justify-content:space-between}
.receipt-paper .row.header{font-weight:800;text-transform:uppercase;font-size:.72rem}
.receipt-paper .row.total{font-weight:800;font-size:1rem;margin-top:6px;padding-top:6px;border-top:2px solid #000}

.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.user-card-lg{background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:12px;transition:all .2s;position:relative}
.user-card-lg:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.user-card-lg .top{display:flex;align-items:center;gap:14px}
.user-card-lg .avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:1.1rem;flex-shrink:0;box-shadow:0 0 16px var(--accent-glow)}
.user-card-lg .info{flex:1;min-width:0}
.user-card-lg .info h4{font-size:.95rem;font-weight:800;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-card-lg .info p{font-size:.75rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.role-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--radius-pill);font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.role-badge.admin{background:rgba(139,92,246,.15);color:var(--purple);border:1px solid rgba(139,92,246,.3)}
.role-badge.staff{background:rgba(34,211,238,.12);color:var(--cyan);border:1px solid rgba(34,211,238,.3)}
.user-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle)}
.user-stats .s{text-align:center}
.user-stats .s strong{display:block;font-size:1rem;font-weight:800;color:var(--accent-bright);font-variant-numeric:tabular-nums}
.user-stats .s span{font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.user-actions{display:flex;gap:6px;flex-wrap:wrap}
.user-actions button{flex:1;min-width:80px;padding:8px 12px;border-radius:var(--radius-sm);font-size:.75rem;font-weight:700;cursor:pointer;border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--text-secondary);transition:all .15s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.user-actions button:hover{background:var(--bg-secondary);color:var(--accent-bright);border-color:var(--border-strong)}
.user-actions button.danger:hover{background:rgba(239,68,68,.15);color:var(--danger)}
.you-tag{position:absolute;top:12px;right:12px;padding:3px 8px;background:var(--accent-soft);color:var(--accent-bright);border-radius:var(--radius-pill);font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:1px}

.search-input-wrap{position:relative;flex:1;max-width:320px}
.search-input-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.85rem;pointer-events:none}
.search-input-wrap input{width:100%;padding:10px 14px 10px 40px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-primary);font-size:.85rem;outline:none;font-family:inherit;transition:all .2s}
.search-input-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ================= FLOAT TABS ================= */
.float-tabs{display:flex;gap:6px;padding:6px;background:var(--bg-tertiary);border-radius:var(--radius-pill);border:1px solid var(--border-subtle);width:fit-content;flex-wrap:wrap}
.float-tab{padding:10px 22px;border-radius:var(--radius-pill);font-size:.85rem;font-weight:800;cursor:pointer;border:none;background:transparent;color:var(--text-secondary);transition:all .25s;font-family:inherit;display:flex;align-items:center;gap:8px}
.float-tab.active.mpesa{background:linear-gradient(135deg,var(--mpesa),var(--mpesa-dark));color:#fff;box-shadow:0 4px 20px rgba(0,166,81,.4)}
.float-tab.active.cash{background:linear-gradient(135deg,var(--cash),var(--cash-dark));color:#fff;box-shadow:0 4px 20px rgba(16,185,129,.4)}
.float-tab.active.sales{background:linear-gradient(135deg,var(--sales),var(--sales-dark));color:#fff;box-shadow:0 4px 20px rgba(139,92,246,.4)}
.float-tab:hover:not(.active){color:var(--text-primary);background:rgba(255,255,255,.03)}

.transfer-banner{display:flex;align-items:center;gap:16px;padding:18px 22px;background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(59,130,246,.06));border:1px solid rgba(34,211,238,.3);border-radius:var(--radius-lg);position:relative;overflow:hidden}
.transfer-banner::before{content:'';position:absolute;top:-50%;right:-10%;width:300px;height:300px;background:radial-gradient(circle,rgba(34,211,238,.15),transparent 65%);pointer-events:none}
.transfer-banner .tb-icon{width:44px;height:44px;border-radius:12px;background:rgba(34,211,238,.18);color:var(--cyan);display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0}
.transfer-banner .tb-text{flex:1;position:relative;z-index:1}
.transfer-banner .tb-text h4{font-size:.88rem;font-weight:800;color:var(--text-primary);margin-bottom:3px}
.transfer-banner .tb-text p{font-size:.75rem;color:var(--text-muted);line-height:1.5}
.transfer-banner .tb-text strong{color:var(--cyan)}
.transfer-banner .tb-arrows{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;color:var(--cyan);position:relative;z-index:1;flex-shrink:0}
.transfer-banner .tb-arrows i{font-size:.9rem}

.float-hero{position:relative;background:linear-gradient(145deg,rgba(0,166,81,.22) 0%,rgba(0,122,61,.08) 40%,rgba(12,26,51,.6) 100%);border:1px solid rgba(0,166,81,.35);border-radius:var(--radius-xl);padding:36px;overflow:hidden;box-shadow:0 20px 60px rgba(0,166,81,.15),inset 0 1px 0 rgba(255,255,255,.06)}
.float-hero::before{content:'';position:absolute;top:-50%;right:-20%;width:500px;height:500px;background:radial-gradient(circle,rgba(0,166,81,.15) 0%,transparent 65%);pointer-events:none}
.float-hero.cash{background:linear-gradient(145deg,rgba(16,185,129,.22) 0%,rgba(5,120,87,.08) 40%,rgba(12,26,51,.6) 100%);border-color:rgba(16,185,129,.35);box-shadow:0 20px 60px rgba(16,185,129,.15),inset 0 1px 0 rgba(255,255,255,.06)}
.float-hero.cash::before{background:radial-gradient(circle,rgba(16,185,129,.15) 0%,transparent 65%)}
.float-hero.sales{background:linear-gradient(145deg,rgba(139,92,246,.22) 0%,rgba(109,40,217,.08) 40%,rgba(12,26,51,.6) 100%);border-color:rgba(139,92,246,.35);box-shadow:0 20px 60px rgba(139,92,246,.15),inset 0 1px 0 rgba(255,255,255,.06)}
.float-hero.sales::before{background:radial-gradient(circle,rgba(139,92,246,.15) 0%,transparent 65%)}
.float-hero-grid{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center;position:relative;z-index:1}
.float-hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(0,166,81,.18);border:1px solid rgba(74,222,128,.3);border-radius:var(--radius-pill);color:var(--mpesa-light);font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:2px;margin-bottom:16px}
.float-hero-badge.cash{background:rgba(16,185,129,.18);border-color:rgba(52,211,153,.3);color:var(--cash-light)}
.float-hero-badge.sales{background:rgba(139,92,246,.18);border-color:rgba(167,139,250,.3);color:var(--sales-light)}
.float-hero-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--mpesa-light);box-shadow:0 0 10px var(--mpesa-light);animation:blink 2s infinite}
.float-hero-badge.cash .dot{background:var(--cash-light);box-shadow:0 0 10px var(--cash-light)}
.float-hero-badge.sales .dot{background:var(--sales-light);box-shadow:0 0 10px var(--sales-light)}
.float-hero-label{font-size:.75rem;color:var(--mpesa-light);text-transform:uppercase;letter-spacing:2.5px;font-weight:800;margin-bottom:10px;opacity:.85}
.float-hero.cash .float-hero-label{color:var(--cash-light)}
.float-hero.sales .float-hero-label{color:var(--sales-light)}
.float-hero-value{font-size:clamp(2.5rem,7vw,4rem);font-weight:900;color:#fff;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;margin-bottom:14px;text-shadow:0 4px 24px rgba(0,166,81,.3)}
.float-hero.cash .float-hero-value{text-shadow:0 4px 24px rgba(16,185,129,.3)}
.float-hero.sales .float-hero-value{text-shadow:0 4px 24px rgba(139,92,246,.3)}
.float-hero-value .currency{font-size:.5em;font-weight:800;color:var(--mpesa-light);letter-spacing:0;vertical-align:middle;margin-right:6px;opacity:.9}
.float-hero.cash .float-hero-value .currency{color:var(--cash-light)}
.float-hero.sales .float-hero-value .currency{color:var(--sales-light)}
.float-hero-meta{display:flex;align-items:center;gap:20px;flex-wrap:wrap;font-size:.8rem;color:var(--text-secondary)}
.float-hero-meta .item{display:flex;align-items:center;gap:6px}
.float-hero-meta .item i{color:var(--mpesa-light);font-size:.85rem}
.float-hero.cash .float-hero-meta .item i{color:var(--cash-light)}
.float-hero.sales .float-hero-meta .item i{color:var(--sales-light)}
.float-hero-meta .item strong{color:var(--text-primary);font-weight:800}
.float-hero-status{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.float-health{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:var(--radius-pill);font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.float-health.healthy{background:rgba(16,185,129,.15);color:var(--success);border:1px solid rgba(16,185,129,.3)}
.float-health.low{background:rgba(245,158,11,.15);color:var(--warning);border:1px solid rgba(245,158,11,.3)}
.float-health.critical{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
.float-velocity{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--text-muted);font-weight:700}
.float-health-bar{margin-top:24px;position:relative;z-index:1}
.float-health-bar .bar-track{height:8px;background:rgba(0,0,0,.3);border-radius:var(--radius-pill);overflow:hidden;position:relative}
.float-health-bar .bar-fill{height:100%;border-radius:var(--radius-pill);background:linear-gradient(90deg,var(--mpesa),var(--mpesa-light));transition:width .6s cubic-bezier(.2,.8,.2,1),background .3s;box-shadow:0 0 12px rgba(0,166,81,.35)}
.float-health-bar .bar-fill.cash{background:linear-gradient(90deg,var(--cash),var(--cash-light));box-shadow:0 0 12px rgba(16,185,129,.35)}
.float-health-bar .bar-fill.sales{background:linear-gradient(90deg,var(--sales),var(--sales-light));box-shadow:0 0 12px rgba(139,92,246,.35)}
.float-health-bar .bar-fill.low{background:linear-gradient(90deg,var(--warning),#fbbf24)}
.float-health-bar .bar-fill.critical{background:linear-gradient(90deg,var(--danger),#f87171)}
.float-health-bar .bar-labels{display:flex;justify-content:space-between;margin-top:8px;font-size:.68rem;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:1px}

.float-action-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.float-action-card{position:relative;padding:22px 18px;border-radius:var(--radius-lg);border:1px solid var(--border-subtle);background:var(--bg-secondary);cursor:pointer;transition:all .25s cubic-bezier(.2,.8,.2,1);text-align:left;font-family:inherit;color:var(--text-primary);overflow:hidden;display:flex;flex-direction:column;gap:12px}
.float-action-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.float-action-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.4);border-color:var(--border-strong)}
.float-action-card:hover::before{transform:scaleX(1)}
.float-action-card.deposit::before{background:linear-gradient(90deg,var(--mpesa),var(--mpesa-light))}
.float-action-card.deposit:hover{border-color:rgba(0,166,81,.5);background:linear-gradient(145deg,var(--bg-secondary),rgba(0,166,81,.06))}
.float-action-card.withdraw::before{background:linear-gradient(90deg,var(--danger),#f87171)}
.float-action-card.withdraw:hover{border-color:rgba(239,68,68,.5);background:linear-gradient(145deg,var(--bg-secondary),rgba(239,68,68,.06))}
.float-action-card.reconcile::before{background:linear-gradient(90deg,var(--accent),var(--cyan))}
.float-action-card.reconcile:hover{border-color:rgba(59,130,246,.5);background:linear-gradient(145deg,var(--bg-secondary),rgba(59,130,246,.06))}
.float-action-card.settings::before{background:linear-gradient(90deg,var(--purple),#a78bfa)}
.float-action-card.settings:hover{border-color:rgba(139,92,246,.5);background:linear-gradient(145deg,var(--bg-secondary),rgba(139,92,246,.06))}
.float-action-card.salescollect::before{background:linear-gradient(90deg,var(--sales),var(--sales-light))}
.float-action-card.salescollect:hover{border-color:rgba(139,92,246,.5);background:linear-gradient(145deg,var(--bg-secondary),rgba(139,92,246,.06))}
.float-action-card .icon-wrap{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;position:relative}
.float-action-card.deposit .icon-wrap{background:rgba(0,166,81,.15);color:var(--mpesa-light)}
.float-action-card.withdraw .icon-wrap{background:rgba(239,68,68,.12);color:var(--danger)}
.float-action-card.reconcile .icon-wrap{background:rgba(59,130,246,.12);color:var(--accent-bright)}
.float-action-card.settings .icon-wrap{background:rgba(139,92,246,.12);color:var(--purple)}
.float-action-card.salescollect .icon-wrap{background:rgba(139,92,246,.15);color:var(--sales-light)}
.float-action-card .card-title{font-size:.95rem;font-weight:800;color:var(--text-primary);letter-spacing:-.2px}
.float-action-card .card-sub{font-size:.72rem;color:var(--text-muted);line-height:1.4}
.float-action-card .card-arrow{position:absolute;top:18px;right:18px;color:var(--text-muted);font-size:.75rem;transition:transform .25s;opacity:.5}
.float-action-card:hover .card-arrow{transform:translate(3px,-3px);opacity:1;color:var(--accent-bright)}
.float-stats-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.float-stat-mini{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:16px;transition:all .2s}
.float-stat-mini:hover{border-color:rgba(0,166,81,.3);background:linear-gradient(145deg,var(--bg-secondary),rgba(0,166,81,.04))}
.float-stat-mini.cash:hover{border-color:rgba(16,185,129,.3);background:linear-gradient(145deg,var(--bg-secondary),rgba(16,185,129,.04))}
.float-stat-mini.sales:hover{border-color:rgba(139,92,246,.3);background:linear-gradient(145deg,var(--bg-secondary),rgba(139,92,246,.04))}
.float-stat-mini .mini-label{font-size:.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.4px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.float-stat-mini .mini-label i{font-size:.75rem;color:var(--mpesa-light)}
.float-stat-mini.cash .mini-label i{color:var(--cash-light)}
.float-stat-mini.sales .mini-label i{color:var(--sales-light)}
.float-stat-mini .mini-value{font-size:1.4rem;font-weight:800;color:var(--text-primary);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.float-stat-mini .mini-value.in{color:var(--mpesa-light)}
.float-stat-mini.cash .mini-value.in{color:var(--cash-light)}
.float-stat-mini.sales .mini-value.in{color:var(--sales-light)}
.float-stat-mini .mini-value.out{color:var(--danger)}
.float-stat-mini .mini-sub{font-size:.68rem;color:var(--text-muted);margin-top:4px}
.float-tx-list{display:flex;flex-direction:column;gap:10px;max-height:600px;overflow-y:auto;padding-right:4px;-webkit-overflow-scrolling:touch}
.float-tx-card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);transition:all .2s;position:relative;cursor:pointer;overflow:hidden}
.float-tx-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mpesa)}
.float-tx-card.in::before{background:linear-gradient(180deg,var(--mpesa),var(--mpesa-light))}
.float-tx-card.in.cash::before{background:linear-gradient(180deg,var(--cash),var(--cash-light))}
.float-tx-card.out::before{background:linear-gradient(180deg,var(--danger),#f87171)}
.float-tx-card.sale::before{background:linear-gradient(180deg,var(--purple),#a78bfa)}
.float-tx-card.reconcile::before{background:linear-gradient(180deg,var(--accent),var(--cyan))}
.float-tx-card.collect::before{background:linear-gradient(180deg,var(--sales),var(--sales-light))}
.float-tx-card:hover{background:var(--bg-tertiary);border-color:var(--border-strong);transform:translateX(4px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.float-tx-card .tx-avatar{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0}
.float-tx-card.in .tx-avatar{background:rgba(0,166,81,.15);color:var(--mpesa-light)}
.float-tx-card.in.cash .tx-avatar{background:rgba(16,185,129,.15);color:var(--cash-light)}
.float-tx-card.out .tx-avatar{background:rgba(239,68,68,.12);color:var(--danger)}
.float-tx-card.sale .tx-avatar{background:rgba(139,92,246,.12);color:var(--purple)}
.float-tx-card.reconcile .tx-avatar{background:rgba(59,130,246,.12);color:var(--accent-bright)}
.float-tx-card.collect .tx-avatar{background:rgba(139,92,246,.15);color:var(--sales-light)}
.float-tx-card .tx-body{flex:1;min-width:0}
.float-tx-card .tx-title{font-size:.88rem;font-weight:800;color:var(--text-primary);margin-bottom:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.float-tx-card .tx-desc{font-size:.72rem;color:var(--text-muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.float-tx-card .tx-desc .ref{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--text-secondary);background:var(--bg-tertiary);padding:2px 7px;border-radius:6px}
.float-tx-card .tx-amount{text-align:right;flex-shrink:0}
.float-tx-card .tx-amount .amt{font-size:1.1rem;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.float-tx-card.in .tx-amount .amt{color:var(--mpesa-light)}
.float-tx-card.in.cash .tx-amount .amt{color:var(--cash-light)}
.float-tx-card.out .tx-amount .amt{color:var(--danger)}
.float-tx-card.sale .tx-amount .amt{color:var(--purple)}
.float-tx-card.reconcile .tx-amount .amt{color:var(--accent-bright)}
.float-tx-card.collect .tx-amount .amt{color:var(--sales-light)}
.float-tx-card .tx-amount .bal{font-size:.65rem;color:var(--text-muted);margin-top:3px;font-variant-numeric:tabular-nums}
.float-tx-card .tx-actions{display:flex;gap:4px;flex-shrink:0;margin-left:6px}
.float-tx-card .tx-actions button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-tertiary);color:var(--text-secondary);cursor:pointer;font-size:.7rem;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit}
.float-tx-card .tx-actions button:hover{background:var(--bg-elevated);color:var(--accent-bright);border-color:var(--border-strong)}
.float-tx-card .tx-actions button.danger:hover{background:rgba(239,68,68,.15);color:var(--danger);border-color:rgba(239,68,68,.4)}
.float-tx-type-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--radius-pill);font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.float-tx-type-badge.in{background:rgba(0,166,81,.15);color:var(--mpesa-light)}
.float-tx-type-badge.in.cash{background:rgba(16,185,129,.15);color:var(--cash-light)}
.float-tx-type-badge.out{background:rgba(239,68,68,.15);color:var(--danger)}
.float-tx-type-badge.sale{background:rgba(139,92,246,.15);color:var(--purple)}
.float-tx-type-badge.reconcile{background:rgba(59,130,246,.15);color:var(--accent-bright)}
.float-tx-type-badge.collect{background:rgba(139,92,246,.15);color:var(--sales-light)}
.reconcile-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px;background:var(--bg-tertiary);border-radius:var(--radius-md);border:1px solid var(--border-subtle)}
.reconcile-summary .item{text-align:center}
.reconcile-summary .item .lbl{font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.reconcile-summary .item .val{font-size:1.3rem;font-weight:800;color:var(--text-primary);font-variant-numeric:tabular-nums;margin-top:4px}
.reconcile-summary .item .val.positive{color:var(--success)}
.reconcile-summary .item .val.negative{color:var(--danger)}
.float-preview-box{padding:16px;background:var(--bg-tertiary);border-radius:var(--radius-md);border:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:10px}
.float-preview-box .row{display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
.float-preview-box .row .lbl{color:var(--text-muted);font-weight:600}
.float-preview-box .row .val{font-weight:800;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.float-preview-box .row.highlight{padding-top:10px;border-top:1px dashed var(--border-subtle);margin-top:2px}
.float-preview-box .row.highlight .val{font-size:1.15rem;color:var(--mpesa-light)}
.float-preview-box.cash .row.highlight .val{color:var(--cash-light)}
.float-preview-box.sales .row.highlight .val{color:var(--sales-light)}

.transfer-flow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px;background:var(--bg-tertiary);border-radius:var(--radius-md);border:1px solid var(--border-subtle);margin-bottom:12px}
.transfer-flow .tf-side{flex:1;text-align:center}
.transfer-flow .tf-side .tf-label{font-size:.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:800;margin-bottom:5px}
.transfer-flow .tf-side .tf-before{font-size:.75rem;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.transfer-flow .tf-side .tf-after{font-size:1.05rem;font-weight:800;font-variant-numeric:tabular-nums;margin-top:3px}
.transfer-flow .tf-side.source .tf-after.down{color:var(--danger)}
.transfer-flow .tf-side.source .tf-after.up{color:var(--success)}
.transfer-flow .tf-side.dest .tf-after.down{color:var(--danger)}
.transfer-flow .tf-side.dest .tf-after.up{color:var(--success)}
.transfer-flow .tf-arrow{font-size:1.4rem;color:var(--cyan);flex-shrink:0}

.danger-zone{border:1px solid rgba(239,68,68,.3);border-radius:var(--radius-lg);padding:20px;background:linear-gradient(145deg,rgba(239,68,68,.05),transparent)}
.danger-zone-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.danger-zone-header i{color:var(--danger);font-size:1.1rem}
.danger-zone-header h4{font-size:.9rem;font-weight:800;color:var(--danger);text-transform:uppercase;letter-spacing:1px}
.danger-zone p{font-size:.78rem;color:var(--text-muted);margin-bottom:14px;line-height:1.5}
.danger-zone .danger-actions{display:flex;gap:8px;flex-wrap:wrap}

.toast-container{position:fixed;top:calc(20px + var(--safe-top));right:20px;z-index:10000;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:380px}
.toast{background:var(--bg-elevated);border:1px solid var(--border-strong);border-left:4px solid var(--accent);border-radius:var(--radius-md);padding:14px 20px;box-shadow:var(--shadow-lg);color:var(--text-primary);font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:12px;animation:toastIn .3s;pointer-events:auto}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.toast.success{border-left-color:var(--success)}.toast.success i{color:var(--success)}
.toast.error{border-left-color:var(--danger)}.toast.error i{color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}.toast.warning i{color:var(--warning)}
.toast.mpesa{border-left-color:var(--mpesa)}.toast.mpesa i{color:var(--mpesa-light)}
.toast.cash{border-left-color:var(--cash)}.toast.cash i{color:var(--cash-light)}
.toast.sales{border-left-color:var(--sales)}.toast.sales i{color:var(--sales-light)}
.toast i{font-size:1.05rem}

/* ================= MODERN ANALYTICS ================= */
.analytics-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.an-kpi{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:20px;position:relative;overflow:hidden;transition:all .25s}
.an-kpi:hover{transform:translateY(-2px);border-color:var(--border-strong);box-shadow:var(--shadow-md)}
.an-kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--cyan),transparent);opacity:.7}
.an-kpi.green::before{background:linear-gradient(90deg,var(--success),var(--cash-light),transparent)}
.an-kpi.purple::before{background:linear-gradient(90deg,var(--purple),#a78bfa,transparent)}
.an-kpi.amber::before{background:linear-gradient(90deg,var(--warning),#fbbf24,transparent)}
.an-kpi .kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.an-kpi .kpi-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1rem}
.an-kpi .kpi-icon.blue{background:var(--accent-soft);color:var(--accent-bright)}
.an-kpi .kpi-icon.green{background:rgba(16,185,129,.12);color:var(--success)}
.an-kpi .kpi-icon.purple{background:rgba(139,92,246,.12);color:var(--purple)}
.an-kpi .kpi-icon.amber{background:rgba(245,158,11,.12);color:var(--warning)}
.an-kpi .kpi-label{font-size:.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.4px;font-weight:800}
.an-kpi .kpi-value{font-size:1.7rem;font-weight:900;color:var(--text-primary);letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.an-kpi .kpi-sub{font-size:.72rem;color:var(--text-muted);margin-top:6px}
.an-kpi .kpi-trend{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:var(--radius-pill);margin-left:6px}
.an-kpi .kpi-trend.up{background:rgba(16,185,129,.12);color:var(--success)}
.an-kpi .kpi-trend.down{background:rgba(239,68,68,.12);color:var(--danger)}
.an-grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.an-grid-2.reverse{grid-template-columns:1fr 1.4fr}
@media (max-width:900px){.an-grid-2,.an-grid-2.reverse{grid-template-columns:1fr}}

.leaderboard{display:flex;flex-direction:column;gap:8px}
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);transition:all .15s}
.lb-row:hover{background:var(--bg-elevated);transform:translateX(3px);border-color:var(--border-strong)}
.lb-rank{width:28px;height:28px;border-radius:8px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:var(--text-muted);flex-shrink:0}
.lb-row:nth-child(1) .lb-rank{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000}
.lb-row:nth-child(2) .lb-rank{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#000}
.lb-row:nth-child(3) .lb-rank{background:linear-gradient(135deg,#fdba74,#ea580c);color:#000}
.lb-info{flex:1;min-width:0}
.lb-info .lb-name{font-size:.85rem;font-weight:800;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-info .lb-meta{font-size:.68rem;color:var(--text-muted);margin-top:2px}
.lb-amount{font-size:.9rem;font-weight:900;color:var(--accent-bright);font-variant-numeric:tabular-nums;flex-shrink:0}

.payment-mix{display:flex;flex-direction:column;gap:12px;padding:4px 0}
.pm-row{display:flex;flex-direction:column;gap:6px}
.pm-head{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:700}
.pm-head .pm-name{display:flex;align-items:center;gap:8px;color:var(--text-secondary)}
.pm-head .pm-name i{font-size:.85rem}
.pm-head .pm-val{color:var(--text-primary);font-weight:900;font-variant-numeric:tabular-nums}
.pm-track{height:8px;background:var(--bg-tertiary);border-radius:var(--radius-pill);overflow:hidden}
.pm-fill{height:100%;border-radius:var(--radius-pill);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pm-fill.cash{background:linear-gradient(90deg,var(--cash),var(--cash-light))}
.pm-fill.mpesa{background:linear-gradient(90deg,var(--mpesa),var(--mpesa-light))}
.pm-fill.card{background:linear-gradient(90deg,var(--purple),#a78bfa)}
.pm-fill.bank{background:linear-gradient(90deg,var(--accent),var(--cyan))}

.heat-strip{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin-top:12px}
.heat-cell{aspect-ratio:1;border-radius:3px;background:var(--bg-tertiary);transition:all .2s}
.heat-cell:hover{transform:scale(1.4);z-index:2;position:relative}
.heat-labels{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin-top:6px;font-size:.55rem;color:var(--text-muted);text-align:center;font-weight:700}

@media print{
  body *{visibility:hidden}
  .print-target,.print-target *{visibility:visible}
  .print-target{position:absolute;left:0;top:0;width:100%}
  .modal-overlay{position:static;background:#fff;padding:0;opacity:1;pointer-events:auto}
  .modal{box-shadow:none;border:none;background:#fff;max-width:100%}
  .modal-header,.modal-footer{display:none}
}

@media (max-width:900px){

function isStorageWorking(type) {
  try {
    const s = type === 'local' ? window.localStorage : window.sessionStorage;
    const k = '__test_' + Date.now();
    s.setItem(k, 'ok');
    const v = s.getItem(k);
    s.removeItem(k);
    return v === 'ok';
  } catch (e) { return false; }
}

async function pickBestPersistence() {
  if (isStorageWorking('local')) {

  if (isStorageWorking('session')) {
    try { await setPersistence(auth, browserSessionPersistence); console.log('✅ Persistence: SESSION'); return 'session'; }
    catch (e) { console.warn('session persistence failed:', e); }
  }
  try { await setPersistence(auth, inMemoryPersistence); console.log('✅ Persistence: MEMORY'); return 'memory'; }

function markAuthIntent() {

function clearAuthIntent() {
  try {
    const u = new URL(window.location.href);
    u.searchParams.delete('auth_intent');

    window.history.replaceState({}, '', u.toString());

let audioCtx = null;
function beep(freq = 900, duration = 90) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration / 1000);
  } catch (e) {}
}

async function doGoogleSignIn() {
  if (!firebaseReady) await firebaseReadyPromise;
  await pickBestPersistence();

  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });

  try {
    console.log('🔵 Attempting popup sign-in');
    await signInWithPopup(auth, provider);
    clearAuthIntent();
    console.log('✅ Popup sign-in succeeded');
    return;
  } catch (err) {
    console.warn('Popup error:', err.code, err.message);

    if (err.code === 'auth/popup-closed-by-user' ||
        err.code === 'auth/cancelled-popup-request') {
      throw err;
    }

    if (err.code === 'auth/argument-error' ||
        (err.message && err.message.includes('missing initial state'))) {
      console.log('🔧 Clearing stale state, retrying popup');
      clearAuthIntent();
      if (window.location.hash) {
        window.history.replaceState({}, '', window.location.pathname + window.location.search);
      }
      const p2 = new GoogleAuthProvider();
      p2.setCustomParameters({ prompt: 'select_account' });
      await signInWithPopup(auth, p2);
      return;
    }

    if (err.code === 'auth/popup-blocked' ||
        err.code === 'auth/operation-not-supported-in-this-environment') {
      console.log('⚠️ Popup blocked → falling back to redirect');
      markAuthIntent();
      try { await setPersistence(auth, browserSessionPersistence); } catch(e){}
      await signInWithRedirect(auth, provider);
      return;
    }

    throw err;
  }
}

  activeFloatTab = tab;
  document.getElementById('tabFloatMpesa').classList.toggle('active', tab === 'mpesa');

function switchView(view) {
  document.querySelectorAll('.nav-item[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
  const titles = {
    dashboard: ['Dashboard','Real-time overview of your store'],
    transactions: ['Transactions','Complete sales history — click any row to edit'],
    inventory: ['Inventory','Manage your product catalog'],
    float: ['Floats & Drawers','Three independent ledgers — M-Pesa, Cash Float, Cash Sales'],
    users: ['Users','Manage team members and roles'],
    staff: ['Staff Performance','Sales by team member'],
    analytics: ['Analytics','Modern, live performance analytics']
  };
  const t = titles[view] || titles.dashboard;
  document.getElementById('pageTitle').textContent = t[0];
  document.getElementById('pageSub').textContent = t[1];
  if (view === 'analytics') setTimeout(renderAnalytics, 60);
  if (view === 'dashboard') setTimeout(initChart, 100);
  if (view === 'float') setTimeout(() => {
    renderFloatTransactions();

    if (activeFloatTab === 'cash') initCashTrendChart();

  }, 50);
  document.getElementById('sidebar')?.classList.remove('open');
  document.getElementById('sidebarBackdrop')?.classList.remove('open');
}

/* ============================================================
   M-PESA FLOAT STATS
   ============================================================ */
function getTodayFloatStats() {
  const start = new Date(); start.setHours(0,0,0,0);
  const today = floatTransactions.filter(t => (t.timestamp||0) >= start.getTime());
  const inAmt = today.filter(t => t.type === 'in').reduce((s,t) => s + (t.amount||0), 0);
  const outAmt = today.filter(t => t.type === 'out').reduce((s,t) => s + (t.amount||0), 0);
  const sales = today.filter(t => t.type === 'sale').reduce((s,t) => s + (t.amount||0), 0);
  return {
    deposits: inAmt, withdrawals: outAmt, sales,
    depositCount: today.filter(t => t.type === 'in').length,
    withdrawalCount: today.filter(t => t.type === 'out').length,
    saleCount: today.filter(t => t.type === 'sale').length,
    net: inAmt - outAmt - sales,
    count: today.length
  };
}

function getWeekFloatNet() {
  const now = Date.now();
  const week = floatTransactions.filter(t => (t.timestamp||0) >= now - 7*86400000);
  return week.reduce((s,t) => {
    if (t.type === 'in') return s + (t.amount||0);
    if (t.type === 'out' || t.type === 'sale') return s - (t.amount||0);
    return s;
  }, 0);
}

function updateFloatDisplay() {
  const formatted = fmtMoney(floatBalance);
  const balanceEl = document.getElementById('floatBalance');
  const topEl = document.getElementById('topFloatMpesa');
  const statEl = document.getElementById('statFloat');
  const subEl = document.getElementById('statFloatSub');
  const updatedEl = document.getElementById('floatUpdated');
  const threshEl = document.getElementById('floatThreshold');

  if (balanceEl) {
    const num = floatBalance.toFixed(2);
    const parts = num.split('.');
    const intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    balanceEl.innerHTML = `<span class="currency">KSh</span>${intPart}.${parts[1]}`;
  }
  if (topEl) topEl.textContent = formatted;
  if (statEl) statEl.textContent = formatted;
  if (threshEl) threshEl.textContent = fmtMoney(floatLowThreshold);

  if (subEl) {
    if (floatBalance < floatLowThreshold) {
      subEl.textContent = '⚠️ Below threshold — please top up';
      subEl.style.color = 'var(--warning)';
    } else {
      subEl.textContent = 'Available balance';
      subEl.style.color = 'var(--text-muted)';
    }
  }
  if (updatedEl) updatedEl.textContent = timeAgo(Date.now());

  const navBadge = document.getElementById('navFloatCount');
  if (navBadge) navBadge.textContent = floatTransactions.length + cashTransactions.length + salesTransactions.length;

  const healthEl = document.getElementById('floatHealth');
  const healthText = document.getElementById('floatHealthText');
  const barFill = document.getElementById('floatBarFill');
  if (healthEl && healthText && barFill) {
    const ratio = floatLowThreshold > 0 ? floatBalance / (floatLowThreshold * 3) : 1;
    const pct = Math.min(100, Math.max(0, ratio * 100));
    barFill.style.width = pct + '%';

    if (floatBalance < floatLowThreshold * 0.5) {
      healthEl.className = 'float-health critical';
      healthText.textContent = 'Critical';
      healthEl.querySelector('i').className = 'fas fa-circle-exclamation';
      barFill.className = 'bar-fill critical';
    } else if (floatBalance < floatLowThreshold) {
      healthEl.className = 'float-health low';
      healthText.textContent = 'Low';
      healthEl.querySelector('i').className = 'fas fa-triangle-exclamation';
      barFill.className = 'bar-fill low';
    } else {
      healthEl.className = 'float-health healthy';
      healthText.textContent = 'Healthy';
      healthEl.querySelector('i').className = 'fas fa-circle-check';
      barFill.className = 'bar-fill';
    }
  }

  const stats = getTodayFloatStats();
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  set('floatTodayIn', fmtMoney(stats.deposits));
  set('floatTodayInCount', stats.depositCount + ' transaction' + (stats.depositCount !== 1 ? 's' : ''));
  set('floatTodayOut', fmtMoney(stats.withdrawals));
  set('floatTodayOutCount', stats.withdrawalCount + ' transaction' + (stats.withdrawalCount !== 1 ? 's' : ''));
  set('floatTodaySales', fmtMoney(stats.sales));
  set('floatTodaySalesCount', stats.saleCount + ' sale' + (stats.saleCount !== 1 ? 's' : ''));
  set('floatTodayNet', (stats.net >= 0 ? '+' : '') + fmtMoney(stats.net));
  set('floatWeekNet', (getWeekFloatNet() >= 0 ? '+' : '') + fmtMoney(getWeekFloatNet()));

function updateTransferPreview() {
  const amount = parseFloat(document.getElementById('transferAmount').value) || 0;
  const preview = document.getElementById('transferPreview');
  const isDeposit = transferDirection === 'deposit';
  const srcAfterEl = document.getElementById('tfSourceAfter');
  const dstAfterEl = document.getElementById('tfDestAfter');

  if (amount <= 0) {
    preview.style.display = 'none';
    srcAfterEl.textContent = '—'; srcAfterEl.className = 'tf-after';
    dstAfterEl.textContent = '—'; dstAfterEl.className = 'tf-after';
    return;
  }

  const newFloat = isDeposit ? floatBalance - amount : floatBalance + amount;
  const newCash = isDeposit ? cashBalance + amount : cashBalance - amount;

  preview.style.display = 'flex';
  document.getElementById('tpMpesaAfter').textContent = fmtMoney(Math.max(0, newFloat));
  document.getElementById('tpCashAfter').textContent = fmtMoney(Math.max(0, newCash));

  if (isDeposit) {

    dstAfterEl.textContent = fmtMoney(Math.max(0, newCash));

  } else {

    srcAfterEl.className = 'tf-after ' + (newCash < cashBalance ? 'down' : 'up');
    dstAfterEl.textContent = fmtMoney(Math.max(0, newFloat));
    dstAfterEl.className = 'tf-after ' + (newFloat > floatBalance ? 'up' : 'down');

}

async function saveTransfer() {
  const amount = parseFloat(document.getElementById('transferAmount').value);
  const txRef = document.getElementById('transferRef').value.trim();
  const notes = document.getElementById('transferNotes').value.trim();
  const isDeposit = transferDirection === 'deposit';

  if (!amount || amount <= 0) { toast('Enter a valid amount', 'warning'); return; }

  if (isDeposit) {
    if (amount > floatBalance) {
      toast(`Insufficient M-Pesa float. Available: ${fmtMoney(floatBalance)}`, 'error', 3500);
      return;
    }
  } else {
    if (amount > cashBalance) {
      toast(`Insufficient cash float. Available: ${fmtMoney(cashBalance)}`, 'error', 3500);
      return;
    }
  }

  const btn = document.getElementById('saveTransfer');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing…';

  const pairId = 'pair_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  const now = Date.now();

  try {
    let newFloat = floatBalance;
    let newCash = cashBalance;

    await runTransaction(ref(db, 'mpesaFloat/balance'), (cur) => {
      const m = cur || 0;
      newFloat = isDeposit ? m - amount : m + amount;
      if (newFloat < 0) throw new Error('INSUFFICIENT_MPESA');
      return +newFloat.toFixed(2);
    });

    await runTransaction(ref(db, 'cashFloat/balance'), (cur) => {
      const c = cur || 0;
      newCash = isDeposit ? c + amount : c - amount;
      if (newCash < 0) throw new Error('INSUFFICIENT_CASH');
      return +newCash.toFixed(2);
    });

    const directionLabel = isDeposit ? 'Deposit (M-Pesa ↓, cash float ↑)' : 'Withdraw (M-Pesa ↑, cash float ↓)';
    const baseNotes = notes || (isDeposit ? 'Agent deposit — cash received' : 'Agent withdraw — cash paid out');

    await set(push(ref(db, 'mpesaFloat/transactions')), {
      type: isDeposit ? 'out' : 'in',
      amount: +amount.toFixed(2),
      reference: txRef || '',
      notes: `${directionLabel} — ${baseNotes}`,
      staff: currentUser.name, staffId: currentUser.uid,
      balanceAfter: +newFloat.toFixed(2),
      previousBalance: +floatBalance.toFixed(2),
      cashBalanceAfter: +newCash.toFixed(2),
      transferPairId: pairId,
      timestamp: now
    });

    await set(push(ref(db, 'cashFloat/transactions')), {
      type: isDeposit ? 'in' : 'out',
      amount: +amount.toFixed(2),
      reference: txRef || '',
      notes: `${directionLabel} — ${baseNotes}`,
      staff: currentUser.name, staffId: currentUser.uid,
      balanceAfter: +newCash.toFixed(2),
      previousBalance: +cashBalance.toFixed(2),
      transferPairId: pairId,
      timestamp: now
    });

    toast(
      `${isDeposit ? 'Deposit' : 'Withdraw'} ${fmtMoney(amount)} — ${isDeposit ? 'float ↓, cash ↑' : 'float ↑, cash ↓'}`,
      'mpesa',
      3500
    );
    beep(1400, 120);
    document.getElementById('transferModal').classList.remove('open');
  } catch (e) {
    console.error(e);
    if (e.message === 'INSUFFICIENT_CASH') toast(`Insufficient cash float`, 'error');
    else if (e.message === 'INSUFFICIENT_MPESA') toast(`Insufficient M-Pesa float`, 'error');
    else toast('Transfer failed: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check"></i> Confirm Transfer';
  }
}

/* ============================================================
   DELETE — reverses both sides
   ============================================================ */
async function deleteFloatTransactionById(id) {
  const tx = floatTransactions.find(t => t.id === id);
  if (!tx) return;

  let confirmMsg = `Delete this ${tx.type} of ${fmtMoney(tx.amount)}?`;
  if (tx.transferPairId) confirmMsg += `\n\nThis was part of an M-Pesa ↔ Cash Float transfer. Both sides will be deleted and balances reversed.`;
  else confirmMsg += `\n\nThis will adjust the M-Pesa float balance.`;
  if (!confirm(confirmMsg)) return;

  try {
    if (tx.transferPairId) {
      await runTransaction(ref(db, 'mpesaFloat/balance'), (cur) => {
        if (tx.type === 'in') return (cur || 0) - tx.amount;
        if (tx.type === 'out') return (cur || 0) + tx.amount;
        return cur || 0;
      });
      await runTransaction(ref(db, 'cashFloat/balance'), (cur) => {
        if (tx.type === 'in') return (cur || 0) + tx.amount;
        if (tx.type === 'out') return (cur || 0) - tx.amount;
        return cur || 0;
      });
      const cashPair = cashTransactions.find(c => c.transferPairId === tx.transferPairId);
      if (cashPair) await remove(ref(db, `cashFloat/transactions/${cashPair.id}`));
    } else {
      if (tx.type === 'in') await runTransaction(ref(db, 'mpesaFloat/balance'), (cur) => (cur || 0) - tx.amount);
      else if (tx.type === 'out' || tx.type === 'sale') await runTransaction(ref(db, 'mpesaFloat/balance'), (cur) => (cur || 0) + tx.amount);
    }
    await remove(ref(db, `mpesaFloat/transactions/${id}`));
    toast('Transaction deleted', 'success');
  } catch (e) {
    console.error(e);
    toast('Failed: ' + e.message, 'error');
  }
}

/* ============================================================
   CASH FLOAT STATS
   ============================================================ */
function getTodayCashStats() {
  const start = new Date(); start.setHours(0,0,0,0);
  const today = cashTransactions.filter(t => (t.timestamp||0) >= start.getTime());
  const inAmt = today.filter(t => t.type === 'in').reduce((s,t) => s + (t.amount||0), 0);
  const outAmt = today.filter(t => t.type === 'out').reduce((s,t) => s + (t.amount||0), 0);
  return {
    deposits: inAmt, withdrawals: outAmt,
    depositCount: today.filter(t => t.type === 'in').length,
    withdrawalCount: today.filter(t => t.type === 'out').length,
    net: inAmt - outAmt,
    count: today.length
  };
}

function getWeekCashNet() {
  const now = Date.now();
  const week = cashTransactions.filter(t => (t.timestamp||0) >= now - 7*86400000);
  return week.reduce((s,t) => {
    if (t.type === 'in') return s + (t.amount||0);
    if (t.type === 'out') return s - (t.amount||0);
    return s;
  }, 0);
}

function getTodaySalesStats() {
  const start = new Date(); start.setHours(0,0,0,0);
  const today = salesTransactions.filter(t => (t.timestamp||0) >= start.getTime());
  const salesAmt = today.filter(t => t.type === 'sale').reduce((s,t) => s + (t.amount||0), 0);
  const collected = today.filter(t => t.type === 'collect').reduce((s,t) => s + (t.amount||0), 0);
  return {
    sales: salesAmt, collected,
    saleCount: today.filter(t => t.type === 'sale').length,
    collectCount: today.filter(t => t.type === 'collect').length,
    net: salesAmt - collected,
    count: today.length
  };
}
function getWeekSalesNet() {
  const now = Date.now();
  const week = salesTransactions.filter(t => (t.timestamp||0) >= now - 7*86400000);
  return week.reduce((s,t) => {
    if (t.type === 'sale') return s + (t.amount||0);
    if (t.type === 'collect') return s - (t.amount||0);
    return s;
  }, 0);
}
function updateSalesDisplay() {

  if (topEl) topEl.textContent = formatted;

function renderSalesTransactions() {
  const list = document.getElementById('salesTxList');
  if (!list) return;

  let filtered = salesTransactions;
  if (salesFilter !== 'all') filtered = salesTransactions.filter(t => t.type === salesFilter);

  const countEl = document.getElementById('salesTxCount');
  if (countEl) countEl.textContent = filtered.length + ' record' + (filtered.length !== 1 ? 's' : '');

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty"><i class="fas fa-cash-register"></i>No cash sales yet</div>`;
    return;
  }

  list.innerHTML = filtered.map(t => {
    const when = t.timestamp ? timeAgo(t.timestamp) : 'just now';
    const isSale = t.type === 'sale';
    const isCollect = t.type === 'collect';
    const isReconcile = t.type === 'reconcile';

    let icon = 'fa-cart-shopping';
    let amountPrefix = '+';
    let typeClass = 'sale';
    let typeLabel = 'Sale';

    if (isCollect) { icon = 'fa-hand-holding-dollar'; amountPrefix = '-'; typeClass = 'collect'; typeLabel = 'Collected'; }
    else if (isReconcile) { icon = 'fa-scale-balanced'; amountPrefix = ''; typeClass = 'reconcile'; typeLabel = 'Reconcile'; }

    const staffText = t.staff ? `<span><i class="fas fa-user" style="font-size:.65rem"></i> ${escapeHtml(t.staff)}</span>` : '';
    const balText = t.balanceAfter !== undefined ? `Bal: ${fmtMoney(t.balanceAfter)}` : '';

    return `
      <div class="float-tx-card ${typeClass}" data-sales-tx="${t.id}">
        <div class="tx-avatar"><i class="fas ${icon}"></i></div>
        <div class="tx-body">
          <div class="tx-title">${escapeHtml(t.notes || typeLabel)}<span class="float-tx-type-badge ${typeClass}">${typeLabel}</span></div>
          <div class="tx-desc">
            <span><i class="fas fa-clock" style="font-size:.65rem"></i> ${when}</span>
            ${staffText}
          </div>
        </div>
