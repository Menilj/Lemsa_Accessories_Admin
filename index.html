<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#081226">
<title>ElectroPOS · Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{
  --bg-deep:#050d1c;--bg-primary:#081226;--bg-secondary:#0c1a33;--bg-tertiary:#112340;--bg-elevated:#162d4d;
  --bg-glass:rgba(12,26,51,.72);--border-subtle:rgba(59,130,246,.12);--border-strong:rgba(59,130,246,.28);
  --accent:#3b82f6;--accent-hover:#2563eb;--accent-bright:#60a5fa;--accent-soft:rgba(59,130,246,.12);--accent-glow:rgba(59,130,246,.45);
  --cyan:#22d3ee;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--purple:#8b5cf6;
  --text-primary:#f8fafc;--text-secondary:#94a3b8;--text-muted:#64748b;
  --radius-sm:10px;--radius-md:14px;--radius-lg:20px;--radius-xl:28px;--radius-pill:100px;
  --shadow-md:0 8px 32px rgba(0,0,0,.4);--shadow-lg:0 24px 60px rgba(0,0,0,.55);--shadow-glow:0 0 24px var(--accent-glow);
  --sidebar-w:250px;--header-h:72px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
html,body{min-height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-deep);color:var(--text-primary);font-size:14.5px;line-height:1.5;min-height:100vh;overflow-x:hidden}
#app{min-height:100vh;display:flex;flex-direction:column;background:var(--bg-primary);position:relative}
#app::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 800px 600px at 0% 0%,rgba(59,130,246,.10),transparent 60%),radial-gradient(ellipse 700px 500px at 100% 100%,rgba(34,211,238,.06),transparent 60%)}

.loading-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:var(--bg-primary);z-index:9999}
.loading-spinner{width:56px;height:56px;border:3px solid var(--bg-tertiary);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;box-shadow:0 0 30px var(--accent-glow)}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen p{color:var(--text-secondary);font-size:.9rem;letter-spacing:.8px;text-transform:uppercase;font-weight:600}

.fatal-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg-primary)}
.fatal-card{max-width:560px;background:var(--bg-secondary);border:1px solid rgba(239,68,68,.4);border-radius:var(--radius-xl);padding:32px}
.fatal-card .icon{font-size:2.5rem;margin-bottom:14px}
.fatal-card h2{font-size:1.3rem;font-weight:800;margin-bottom:10px;color:var(--danger)}
.fatal-card p{color:var(--text-secondary);font-size:.9rem;margin-bottom:16px;line-height:1.6}
.fatal-card pre{background:var(--bg-tertiary);border-radius:var(--radius-md);padding:14px;color:var(--warning);font-size:.78rem;overflow:auto;white-space:pre-wrap;max-height:260px;font-family:'JetBrains Mono',monospace;margin-bottom:16px}
.fatal-card button{padding:12px 22px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-md);font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem}
.fatal-card a{color:var(--accent-bright)}

.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 0%,rgba(59,130,246,.18),transparent 55%),radial-gradient(circle at 80% 100%,rgba(139,92,246,.10),transparent 55%),var(--bg-primary)}
.login-card{width:100%;max-width:420px;background:var(--bg-glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(147,197,253,.15);border-radius:var(--radius-xl);padding:44px 32px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:16px;animation:slideUp .5s;position:relative;z-index:1}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.login-card .brand-icon{width:72px;height:72px;margin:0 auto;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;box-shadow:var(--shadow-glow)}
.login-card h1{text-align:center;font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#fff 30%,var(--accent-bright));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-card .subtitle{text-align:center;color:var(--text-muted);font-size:.72rem;letter-spacing:2.5px;text-transform:uppercase;margin-top:-8px;margin-bottom:8px;font-weight:700}
.input-group{position:relative}
.input-group i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.9rem;pointer-events:none}
.input-group input{width:100%;padding:16px 18px 16px 46px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-primary);font-size:.95rem;outline:none;transition:all .2s;font-family:inherit}
.input-group input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--bg-elevated)}
.input-group input::placeholder{color:var(--text-muted)}
.login-card button[type="submit"]{padding:16px;background:linear-gradient(135deg,var(--accent),var(--accent-hover));color:#fff;border:none;border-radius:var(--radius-md);font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--shadow-glow);font-family:inherit}
.login-card button[type="submit"]:hover{transform:translateY(-1px)}
.login-card button[type="submit"]:disabled{opacity:.7;cursor:not-allowed}
.login-error{color:var(--danger);font-size:.82rem;text-align:center;min-height:18px;font-weight:500}

.app-shell{flex:1;display:flex;min-height:0;position:relative;z-index:1}
.sidebar{width:var(--sidebar-w);background:var(--bg-secondary);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;padding:20px 14px;flex-shrink:0;transition:transform .3s;position:relative;z-index:100}
.sidebar::before{content:'';position:absolute;top:0;right:0;width:1px;height:100%;background:linear-gradient(180deg,transparent,var(--accent-glow),transparent)}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:8px 8px 24px;border-bottom:1px solid var(--border-subtle);margin-bottom:20px}
.sidebar-logo{width:42px;height:42px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:var(--shadow-glow);flex-shrink:0}
.sidebar-brand-text h1{font-size:1.05rem;font-weight:800;color:var(--text-primary)}
.sidebar-brand-text span{font-size:.62rem;color:var(--text-muted);letter-spacing:1.8px;text-transform:uppercase;font-weight:600}
.nav-group{margin-bottom:20px}
.nav-label{font-size:.65rem;color:var(--text-muted);letter-spacing:1.8px;text-transform:uppercase;font-weight:700;padding:0 12px 8px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius-md);color:var(--text-secondary);font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s;position:relative;border:none;background:transparent;width:100%;text-align:left;font-family:inherit}
.nav-item i{width:20px;text-align:center;font-size:.95rem}
.nav-item:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.nav-item.active{background:linear-gradient(90deg,var(--accent-soft),transparent);color:var(--accent-bright)}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-item .nav-badge{margin-left:auto;background:var(--accent-soft);color:var(--accent-bright);padding:2px 8px;border-radius:var(--radius-pill);font-size:.7rem;font-weight:700}
.sidebar-footer{margin-top:auto;padding-top:20px;border-top:1px solid var(--border-subtle)}
.user-card{display:flex;align-items:center;gap:12px;padding:10px;background:var(--bg-tertiary);border-radius:var(--radius-md);border:1px solid var(--border-subtle);margin-bottom:10px}
.user-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-info h4{font-size:.82rem;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-info p{font-size:.68rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout-btn{width:100%;padding:11px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-secondary);font-size:.82rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;font-family:inherit}
.logout-btn:hover{background:rgba(239,68,68,.15);color:var(--danger)}

.main-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--bg-glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border-subtle);flex-shrink:0;gap:16px;position:relative;z-index:50}
.topbar-left{display:flex;align-items:center;gap:16px;min-width:0}
.menu-toggle{display:none;background:var(--bg-tertiary);border:1px solid var(--border-subtle);width:40px;height:40px;border-radius:var(--radius-md);color:var(--text-secondary);font-size:1rem;cursor:pointer;align-items:center;justify-content:center}
.page-title h2{font-size:1.15rem;font-weight:800;color:var(--text-primary)}
.page-title p{font-size:.75rem;color:var(--text-muted);margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:10px}
.live-pill{display:flex;align-items:center;gap:7px;padding:7px 14px;background:rgba(16,185,129,.10);border:1px solid rgba(16,185,129,.25);border-radius:var(--radius-pill);color:var(--success);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{width:40px;height:40px;border-radius:var(--radius-md);background:var(--bg-tertiary);border:1px solid var(--border-subtle);color:var(--text-secondary);font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.icon-btn:hover{background:var(--bg-elevated);color:var(--accent-bright);border-color:var(--border-strong)}
.scan-btn-primary{padding:0 18px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent-hover));border:none;border-radius:var(--radius-md);color:#fff;font-size:.82rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s;box-shadow:var(--shadow-glow);font-family:inherit}
.scan-btn-primary:hover{transform:translateY(-1px)}
.scan-btn-primary.recording{background:linear-gradient(135deg,var(--danger),#b91c1c);animation:pulseRec 1.5s infinite}
@keyframes pulseRec{0%,100%{box-shadow:0 0 24px rgba(239,68,68,.5)}50%{box-shadow:0 0 40px rgba(239,68,68,.9)}}

.content{flex:1;overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:24px;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px}
.view{display:none;flex-direction:column;gap:24px;animation:fadeIn .25s}
.view.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.stat-card{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:22px;position:relative;overflow:hidden;transition:all .25s}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--cyan),transparent);opacity:.7}
.stat-card:hover{border-color:var(--border-strong);transform:translateY(-3px);box-shadow:var(--shadow-md)}
.stat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.stat-icon{width:46px;height:46px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:1.15rem}
.stat-icon.blue{background:var(--accent-soft);color:var(--accent-bright)}
.stat-icon.cyan{background:rgba(34,211,238,.12);color:var(--cyan)}
.stat-icon.purple{background:rgba(139,92,246,.12);color:var(--purple)}
.stat-icon.green{background:rgba(16,185,129,.12);color:var(--success)}
.stat-label{color:var(--text-muted);font-size:.7rem;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;margin-bottom:8px}
.stat-value{color:var(--text-primary);font-size:2rem;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.stat-sub{color:var(--text-muted);font-size:.75rem;margin-top:8px}

.panel{background:var(--bg-secondary);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:22px;overflow:hidden}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.panel-title{display:flex;align-items:center;gap:12px}
.panel-title-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent-bright);font-size:.95rem}
.panel-title h3{font-size:1rem;font-weight:800;color:var(--text-primary)}
.panel-title p{font-size:.72rem;color:var(--text-muted);margin-top:1px}
.panel-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.filter-tabs{display:flex;gap:4px;background:var(--bg-tertiary);padding:4px;border-radius:var(--radius-pill);border:1px solid var(--border-subtle)}
.filter-tab{padding:7px 16px;border-radius:var(--radius-pill);font-size:.75rem;font-weight:700;color:var(--text-secondary);cursor:pointer;transition:all .15s;background:transparent;border:none;font-family:inherit}
.filter-tab.active{background:var(--accent);color:#fff;box-shadow:0 0 14px var(--accent-glow)}

.tx-list{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow-y:auto;padding-right:4px}
.tx-list::-webkit-scrollbar{width:5px}
.tx-list::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px}
.tx-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);gap:14px;transition:all .18s;position:relative;cursor:pointer}
.tx-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--cyan));opacity:.8}
.tx-row:hover{background:var(--bg-elevated);border-color:var(--border-strong);transform:translateX(3px)}
.tx-left{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.tx-icon{width:42px;height:42px;border-radius:var(--radius-md);background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent-bright);font-size:1rem;flex-shrink:0}
.tx-detail{min-width:0;flex:1}
.tx-detail h4{font-size:.88rem;color:var(--text-primary);font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-detail p{font-size:.72rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-right{text-align:right;flex-shrink:0}
.tx-right .amount{font-size:1.05rem;font-weight:800;color:var(--accent-bright);font-variant-numeric:tabular-nums}
.tx-right .status{font-size:.65rem;color:var(--success);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-top:3px}
.empty{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:.88rem}
.empty i{font-size:2.8rem;opacity:.25;display:block;margin-bottom:16px}

.chart-wrap{position:relative;height:280px;width:100%}

.add-form{display:grid;grid-template-columns:1fr 160px 200px auto;gap:12px}
.field{position:relative}
.field label{position:absolute;top:-8px;left:14px;background:var(--bg-secondary);padding:0 6px;font-size:.65rem;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;pointer-events:none;z-index:1}
.add-form input,.add-form select{padding:14px 16px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-primary);font-size:.9rem;outline:none;transition:all .2s;font-family:inherit;width:100%}
.add-form input:focus,.add-form select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.add-form input::placeholder{color:var(--text-muted)}
.btn-primary{padding:14px 24px;background:linear-gradient(135deg,var(--accent),var(--accent-hover));color:#fff;border:none;border-radius:var(--radius-md);font-weight:700;cursor:pointer;font-size:.9rem;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;box-shadow:var(--shadow-glow);font-family:inherit}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-secondary{padding:12px 20px;background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border-subtle);border-radius:var(--radius-md);font-weight:700;cursor:pointer;font-size:.85rem;transition:all .2s;display:inline-flex;align-items:center;gap:8px;font-family:inherit}
.btn-secondary:hover{background:var(--bg-elevated);color:var(--accent-bright);border-color:var(--border-strong)}

.table-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
.inv-table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:750px}
.inv-table th{text-align:left;padding:12px 14px;color:var(--text-muted);font-size:.68rem;text-transform:uppercase;letter-spacing:1.4px;font-weight:800;border-bottom:1px solid var(--border-subtle);white-space:nowrap}
.inv-table td{padding:15px 14px;border-bottom:1px solid var(--border-subtle);color:var(--text-secondary);vertical-align:middle}
.inv-table tr:last-child td{border-bottom:none}
.inv-table tbody tr{transition:background .15s}
.inv-table tbody tr:hover td{background:var(--bg-tertiary)}
.inv-table td.name{color:var(--text-primary);font-weight:700}
.inv-table td.price{color:var(--accent-bright);font-weight:800;font-variant-numeric:tabular-nums}
.cat-tag{display:inline-block;padding:4px 11px;background:var(--accent-soft);color:var(--accent-bright);border-radius:var(--radius-pill);font-size:.68rem;font-weight:700;text-transform:capitalize}
.stock-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--radius-pill);font-size:.7rem;font-weight:700}
.stock-pill.ok{background:rgba(16,185,129,.12);color:var(--success)}
.stock-pill.low{background:rgba(245,158,11,.12);color:var(--warning)}
.stock-pill.out{background:rgba(239,68,68,.12);color:var(--danger)}
.icon-btn-sm{width:34px;height:34px;border-radius:9px;background:var(--bg-tertiary);border:1px solid var(--border-subtle);color:var(--text-secondary);cursor:pointer;font-size:.8rem;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;margin-left:6px}
.icon-btn-sm:hover{background:var(--bg-elevated);color:var(--accent-bright);border-color:var(--border-strong)}
.icon-btn-sm.danger:hover{background:rgba(239,68,68,.15);color:var(--danger)}

/* Barcode highlight animation for real-time scan */
@keyframes highlightRow {
  0% { background: rgba(16,185,129,.4); }
  100% { background: transparent; }
}
.row-highlight td { animation: highlightRow 2s ease-out; }

.modal-overlay{position:fixed;inset:0;background:rgba(5,13,28,.88);backdrop-filter:blur(10px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:560px;background:var(--bg-secondary);border:1px solid var(--border-strong);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg),0 0 60px var(--accent-glow);overflow:hidden;transform:scale(.95);transition:transform .25s;display:flex;flex-direction:column;max-height:90vh}
.modal.wide{max-width:820px}
.modal-overlay.open .modal{transform:scale(1)}

/* =====================================================

function toast(msg, type = 'info', duration = 2800) {
  let c = document.querySelector('.toast-container');
  if (!c) { c = document.createElement('div'); c.className = 'toast-container'; document.body.appendChild(c); }
  const icons = { info:'fa-circle-info', success:'fa-circle-check', error:'fa-circle-xmark', warning:'fa-triangle-exclamation' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<i class="fas ${icons[type]||icons.info}"></i><span>${escapeHtml(msg)}</span>`;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transform='translateX(30px)'; el.style.transition='.3s'; setTimeout(()=>el.remove(),300); }, duration);
}

function escapeHtml(str){return String(str==null?'':str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmtMoney(n){return '$'+(Number(n)||0).toFixed(2);}
function timeAgo(ts){const d=Date.now()-ts;if(d<60000)return'just now';if(d<3600000)return Math.floor(d/60000)+'m ago';if(d<86400000)return Math.floor(d/3600000)+'h ago';if(d<604800000)return Math.floor(d/86400000)+'d ago';return new Date(ts).toLocaleDateString();}
function iconForCategory(cat){return {phones:'fa-mobile-alt',laptops:'fa-laptop',audio:'fa-headphones',accessories:'fa-plug'}[cat]||'fa-box';}
function initials(name){return (name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function isSelf(uid){return currentUser && currentUser.uid === uid;}
function beep(freq = 900, duration = 90) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + duration / 1000);
  } catch (e) {}
}

    catch (err) {

      btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';

  };

/* =====================================================
   EVENTS
   ===================================================== */
function wireShellEvents() {
  document.getElementById('logoutBtn').onclick = () => signOut(auth);
  document.querySelectorAll('.nav-item[data-view]').forEach(btn => {
    btn.onclick = () => switchView(btn.dataset.view);
  });

  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebarBackdrop');
  document.getElementById('menuToggle').onclick = () => { sidebar.classList.add('open'); backdrop.classList.add('open'); };
  backdrop.onclick = () => { sidebar.classList.remove('open'); backdrop.classList.remove('open'); };

  document.getElementById('topScanBtn').onclick = () => openScanner('realtime');
  document.getElementById('sidebarScanBtn').onclick = () => { openScanner('realtime'); sidebar.classList.remove('open'); backdrop.classList.remove('open'); };
  document.getElementById('liveScanToggle').onclick = () => openScanner('realtime');
  document.getElementById('closeScanner').onclick = closeScanner;
  document.getElementById('manualLookup').onclick = () => { const v = document.getElementById('manualBarcode').value.trim(); if (v) manualLookup(v); };
  document.getElementById('manualBarcode').onkeypress = e => { if (e.key === 'Enter') { const v = e.target.value.trim(); if (v) manualLookup(v); } };

  document.getElementById('addBtn').onclick = addProduct;
  document.getElementById('newPrice').onkeypress = e => { if (e.key === 'Enter') addProduct(); };
  document.getElementById('invSearch').oninput = renderProducts;

  document.getElementById('filterTabs').onclick = e => {
    const tab = e.target.closest('.filter-tab');
    if (!tab) return;
    document.querySelectorAll('#filterTabs .filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    txFilter = tab.dataset.filter;
    renderTransactions();
  };

  document.getElementById('userFilterTabs').onclick = e => {
    const tab = e.target.closest('.filter-tab');
    if (!tab) return;
    document.querySelectorAll('#userFilterTabs .filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    userFilter = tab.dataset.filter;
    renderUsers();
  };

  document.getElementById('closeEdit').onclick = () => document.getElementById('editModal').classList.remove('open');
  document.getElementById('cancelEdit').onclick = () => document.getElementById('editModal').classList.remove('open');
  document.getElementById('saveEdit').onclick = saveEditProduct;
  document.getElementById('scanForEditBtn').onclick = () => openScanner('assign');

  document.getElementById('closeStock').onclick = () => document.getElementById('stockModal').classList.remove('open');
  document.getElementById('stockAmount').oninput = updateStockPreview;
  document.getElementById('stockAddBtn').onclick = () => changeStock(1);
  document.getElementById('stockRemoveBtn').onclick = () => changeStock(-1);

  document.getElementById('closeLabel').onclick = () => document.getElementById('labelModal').classList.remove('open');
  document.getElementById('cancelLabel').onclick = () => document.getElementById('labelModal').classList.remove('open');
  document.getElementById('printLabel').onclick = () => window.print();
  document.getElementById('labelCopies').oninput = renderLabelPreview;

  document.getElementById('closeReceipt').onclick = () => document.getElementById('receiptModal').classList.remove('open');
  document.getElementById('cancelReceipt').onclick = () => document.getElementById('receiptModal').classList.remove('open');
  document.getElementById('printReceipt').onclick = () => window.print();

  document.getElementById('addUserBtn').onclick = () => document.getElementById('addUserModal').classList.add('open');
  document.getElementById('closeAddUser').onclick = () => document.getElementById('addUserModal').classList.remove('open');
  document.getElementById('cancelAddUser').onclick = () => document.getElementById('addUserModal').classList.remove('open');
  document.getElementById('confirmAddUser').onclick = createNewUser;

  document.getElementById('closeEditUser').onclick = () => document.getElementById('editUserModal').classList.remove('open');
  document.getElementById('cancelEditUser').onclick = () => document.getElementById('editUserModal').classList.remove('open');
  document.getElementById('saveEditUser').onclick = saveEditUser;

  document.getElementById('exportBtn').onclick = exportCSV;
}

function switchView(view) {
  document.querySelectorAll('.nav-item[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
  const titles = {
    dashboard: ['Dashboard','Real-time overview of your store'],
    transactions: ['Transactions','Complete sales history'],
    inventory: ['Inventory','Manage your product catalog'],
    users: ['Users','Manage team members and roles'],
    staff: ['Staff Performance','Sales by team member'],
    analytics: ['Analytics','Deep dive into your sales data']
  };
  const t = titles[view] || titles.dashboard;
  document.getElementById('pageTitle').textContent = t[0];
  document.getElementById('pageSub').textContent = t[1];
  if (view === 'analytics') setTimeout(initCategoryChart, 100);
  if (view === 'dashboard') setTimeout(initChart, 100);
}

/* =====================================================
   PRODUCTS
   ===================================================== */
function renderProducts() {
  const tbody = document.getElementById('invBody');
  const countEl = document.getElementById('invCount');
  if (!tbody) return;

  const q = (document.getElementById('invSearch')?.value || '').toLowerCase();
  const list = q ? products.filter(p => p.name.toLowerCase().includes(q) || (p.barcode||'').includes(q)) : products;

  countEl.textContent = products.length;
  const navCount = document.getElementById('navProdCount');
  if (navCount) navCount.textContent = products.length;

  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><i class="fas fa-box-open"></i>No products</div></td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(p => {
    const stock = p.stock ?? 0;
    const stockClass = stock <= 0 ? 'out' : stock <= 5 ? 'low' : 'ok';
    const stockText = stock <= 0 ? 'Out' : stock + ' in stock';
    return `
      <tr data-product-id="${p.id}">
        <td class="name">${escapeHtml(p.name)}</td>
        <td><span class="cat-tag">${escapeHtml(p.category||'other')}</span></td>
        <td class="price">${fmtMoney(p.price)}</td>
        <td><span class="stock-pill ${stockClass}">${stockText}</span></td>
        <td style="font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--text-muted)">${escapeHtml(p.barcode || '—')}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="icon-btn-sm" data-edit="${p.id}" title="Edit"><i class="fas fa-pen"></i></button>
          <button class="icon-btn-sm" data-stock="${p.id}" title="Stock"><i class="fas fa-boxes-packing"></i></button>
          <button class="icon-btn-sm" data-label="${p.id}" title="Label"><i class="fas fa-tag"></i></button>
          <button class="icon-btn-sm danger" data-del="${p.id}" title="Delete"><i class="fas fa-trash"></i></button>

function renderStockHistory(p) {
  const container = document.getElementById('stockHistory');
  const history = p.stockHistory || {};
  const entries = Object.values(history).sort((a,b) => (b.timestamp||0) - (a.timestamp||0)).slice(0, 10);
  if (entries.length === 0) { container.innerHTML = '<div style="color:var(--text-muted);font-size:.8rem;text-align:center;padding:12px">No history</div>'; return; }
  container.innerHTML = entries.map(e => `
    <div class="stock-history-item">
      <div><span class="change ${e.change > 0 ? 'pos' : 'neg'}">${e.change > 0 ? '+' : ''}${e.change}</span> <span class="meta">→ ${e.after}</span></div>

    </div>`).join('');

async function changeStock(direction) {
  if (!activeStockProductId) return;
  const p = products.find(x => x.id === activeStockProductId);
  if (!p) return;
  const amount = parseInt(document.getElementById('stockAmount').value) || 0;
  if (amount <= 0) { toast('Enter valid amount', 'warning'); return; }
  const change = direction * amount;
  const newStock = Math.max(0, (p.stock || 0) + change);
  try {
    const historyKey = push(ref(db, `products/${activeStockProductId}/stockHistory`)).key;
    await update(ref(db, `products/${activeStockProductId}`), {
      stock: newStock,
      [`stockHistory/${historyKey}`]: { change, after: newStock, by: currentUser.name, timestamp: Date.now() }
    });
    toast(`Stock ${change > 0 ? '+' : ''}${change} → ${newStock}`, 'success');
    document.getElementById('stockModal').classList.remove('open');
  } catch (e) { toast('Failed: ' + e.message, 'error'); }
}

/* =====================================================

   ===================================================== */
function renderTransactions() {
  const now = Date.now(); const dayMs = 86400000;
  let filtered = transactions;
  if (txFilter === 'today') { const s = new Date(); s.setHours(0,0,0,0); filtered = transactions.filter(t => (t.timestamp||0) >= s.getTime()); }
  else if (txFilter === 'week') filtered = transactions.filter(t => (t.timestamp||0) >= now - 7*dayMs);
  else if (txFilter === 'month') filtered = transactions.filter(t => (t.timestamp||0) >= now - 30*dayMs);

  const nav = document.getElementById('navTxCount');
  if (nav) nav.textContent = transactions.length;
  const countEl = document.getElementById('txCount');
  if (countEl) countEl.textContent = filtered.length + ' record' + (filtered.length !== 1 ? 's' : '');

  const htmlFull = filtered.length === 0
    ? `<div class="empty"><i class="fas fa-receipt"></i>No transactions</div>`
    : filtered.map(t => {
        const when = t.timestamp ? timeAgo(t.timestamp) : 'just now';
        const itemCount = (t.items||[]).reduce((s,i) => s + (i.qty||1), 0);
        const names = (t.items||[]).slice(0,2).map(i=>i.name).join(', ') + ((t.items||[]).length > 2 ? '…' : '');
        return `
          <div class="tx-row" data-tx="${t.id}">
            <div class="tx-left"><div class="tx-icon"><i class="fas fa-receipt"></i></div>
              <div class="tx-detail"><h4>${itemCount} item${itemCount!==1?'s':''} · ${escapeHtml(t.staff||'Staff')}</h4><p>${when}${names ? ' · ' + escapeHtml(names) : ''}</p></div>
            </div>
            <div class="tx-right"><div class="amount">${fmtMoney(t.total)}</div><div class="status">${escapeHtml(t.status||'completed')}</div></div>
          </div>`;
      }).join('');

  const dashList = document.getElementById('txListDash');
  const fullList = document.getElementById('txListFull');
  if (dashList) {
    dashList.innerHTML = transactions.length === 0
      ? `<div class="empty"><i class="fas fa-receipt"></i>No transactions yet</div>`
      : transactions.slice(0, 6).map(t => {
          const when = t.timestamp ? timeAgo(t.timestamp) : 'just now';
          const itemCount = (t.items||[]).reduce((s,i) => s + (i.qty||1), 0);
          return `<div class="tx-row" data-tx="${t.id}"><div class="tx-left"><div class="tx-icon"><i class="fas fa-receipt"></i></div><div class="tx-detail"><h4>${itemCount} item${itemCount!==1?'s':''} · ${escapeHtml(t.staff||'Staff')}</h4><p>${when}</p></div></div><div class="tx-right"><div class="amount">${fmtMoney(t.total)}</div></div></div>`;
        }).join('');
  }
  if (fullList) fullList.innerHTML = htmlFull;

  document.querySelectorAll('[data-tx]').forEach(row => {
    row.onclick = () => {
      const tx = transactions.find(t => t.id === row.dataset.tx);
      if (tx) openReceipt(tx);
    };
  });
}

function renderAnalytics() {
  const now = Date.now(); const dayMs = 86400000;
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const today = transactions.filter(t => (t.timestamp||0) >= todayStart.getTime());
  const week = transactions.filter(t => (t.timestamp||0) >= now - 7*dayMs);
  const month = transactions.filter(t => (t.timestamp||0) >= now - 30*dayMs);
  const sum = arr => arr.reduce((s,t) => s + (t.total||0), 0);
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  set('anToday', fmtMoney(sum(today))); set('anTodayCount', today.length + ' sales');
  set('anWeek', fmtMoney(sum(week))); set('anWeekCount', week.length + ' sales');
  set('anMonth', fmtMoney(sum(month))); set('anMonthCount', month.length + ' sales');
  const counts = {};
  transactions.forEach(t => (t.items||[]).forEach(i => { counts[i.name] = (counts[i.name]||0) + (i.qty||1); }));
  const top = Object.entries(counts).sort((a,b) => b[1]-a[1])[0];
  set('anTopProduct', top ? top[0] : '—');
  set('anTopProductCount', top ? `${top[1]} sold` : 'No data');
}

    stats[name].count += 1;
    stats[name].total += t.total || 0;
    stats[name].lastAt = Math.max(stats[name].lastAt, t.timestamp || 0);

  const arr = Object.values(stats).sort((a,b) => b.total - a.total);

/* =====================================================
   ADD USER — Works with OR without Cloud Function
   ===================================================== */
async function createNewUser() {
  const name = document.getElementById('newUserName').value.trim();
  const email = document.getElementById('newUserEmail').value.trim();
  const password = document.getElementById('newUserPassword').value;
  const role = document.getElementById('newUserRole').value;

  if (!name || !email || !password) { toast('Fill all fields', 'warning'); return; }
  if (password.length < 6) { toast('Password must be 6+ chars', 'warning'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('Invalid email format', 'warning'); return; }

  const btn = document.getElementById('confirmAddUser');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating…';

  let createdUid = null;
  let method = 'cloud-function';

  // METHOD 1: Try Cloud Function first
  try {
    const createUserFn = httpsCallable(functions, 'createUser');
    const result = await createUserFn({ name, email, password, role });
    createdUid = result.data.uid;
    console.log('[ElectroPOS] User created via Cloud Function:', createdUid);
  } catch (cfError) {
    console.warn('[ElectroPOS] Cloud Function failed:', cfError.message);
    method = 'client-side';

    // METHOD 2: Fallback — create user in Firebase Auth using client SDK
    // This signs IN the new user (Firebase limitation). We sign back in as admin afterward.
    try {
      // Save current admin credentials (session persistence keeps us signed in)
      const adminEmail = currentUser.email;

      // Create the new user (this will sign them in temporarily)
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      createdUid = cred.user.uid;
      await updateProfile(cred.user, { displayName: name });

      // Immediately write the role node in DB
      await set(ref(db, `users/${createdUid}`), {
        name, email, role,
        createdBy: currentUser.uid,
        createdAt: Date.now()
      });

      console.log('[ElectroPOS] User created via client SDK:', createdUid);

      // Note: the new user is now signed in. We can't sign them out from client SDK
      // without affecting our session. But since we use local persistence and they
      // used a different email, Firebase keeps the LAST signed-in user.
      // So the admin stays signed in on THIS device because we wrote the DB node
      // with the admin's own context BEFORE... actually Firebase Auth only has one
      // current user. This signs in the new user.

      // To restore admin session: sign out, then re-sign in with admin credentials
      // BUT we don't have the admin's password. This is the fundamental limitation.

      // So instead: don't use client SDK fallback for creating users while staying signed in.
      // Throw a friendly error telling the admin to use the Cloud Function or manual method.

      throw new Error(
        'Client-side user creation signs YOU out of your admin session (Firebase limitation). ' +
        'To fix: either deploy the Cloud Function, OR add users manually via Firebase Console → ' +
        'Authentication → Add user, then create a users/<uid> node with role.'
      );
    } catch (clientError) {
      console.error('[ElectroPOS] Client-side fallback failed:', clientError);
      toast(clientError.message || 'User creation failed', 'error', 8000);
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-check"></i> Create';
      return;
    }
  }

  if (createdUid) {
    toast(`User "${name}" created (${role}) via ${method}`, 'success', 3500);
    document.getElementById('newUserName').value = '';
    document.getElementById('newUserEmail').value = '';
    document.getElementById('newUserPassword').value = '';
    document.getElementById('addUserModal').classList.remove('open');
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-check"></i> Create';
}

async function deleteUser(uid) {
  const u = users[uid];
  if (!u) return;
  if (isSelf(uid)) { toast("Can't delete yourself", 'warning'); return; }
  if (!confirm(`Delete "${u.name || u.email}"?\n\nThis removes their role from the database. To fully remove their login, delete them from Firebase Console → Authentication.`)) return;

  // Try Cloud Function first
  try {
    const deleteFn = httpsCallable(functions, 'deleteUser');
    await deleteFn({ uid });
    toast('User deleted (Auth + DB)', 'success');
  } catch (cfError) {
    // Fallback: remove DB node only
    try {
      await remove(ref(db, `users/${uid}`));
      toast('Role removed. Delete Auth account manually in Firebase Console.', 'warning', 5000);
    } catch (e) {
      toast('Failed: ' + e.message, 'error');
    }
  }
}

function initChart() {
  const canvas = document.getElementById('salesChartCanvas');
  if (!canvas || typeof Chart === 'undefined') return;
  const labels = []; const values = [];
  for (let i = 6; i >= 0; i--) {
    const start = new Date(); start.setHours(0,0,0,0); start.setDate(start.getDate() - i);
    const end = new Date(start); end.setDate(end.getDate() + 1);
    labels.push(start.toLocaleDateString('en', { weekday: 'short' }));
    values.push(+transactions.filter(t => (t.timestamp||0) >= start.getTime() && (t.timestamp||0) < end.getTime()).reduce((s,t) => s + (t.total||0), 0).toFixed(2));
  }
  if (salesChart) salesChart.destroy();
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,280);
  grad.addColorStop(0,'rgba(59,130,246,.45)'); grad.addColorStop(1,'rgba(59,130,246,0)');
  salesChart = new Chart(ctx, {
    type:'line',
    data:{labels,datasets:[{label:'Revenue',data:values,borderColor:'#3b82f6',backgroundColor:grad,borderWidth:3,fill:true,tension:.4,pointBackgroundColor:'#60a5fa',pointBorderColor:'#0c1a33',pointBorderWidth:3,pointRadius:5,pointHoverRadius:7}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#0c1a33',borderColor:'#3b82f6',borderWidth:1,padding:12,callbacks:{label:c=>'  $'+c.parsed.y.toFixed(2)}}},scales:{x:{grid:{display:false},ticks:{color:'#64748b',font:{size:11,weight:'600'}}},y:{grid:{color:'rgba(59,130,246,.08)'},ticks:{color:'#64748b',font:{size:11,weight:'600'},callback:v=>'$'+v}}}}
  });
}

function initCategoryChart() {
  const canvas = document.getElementById('categoryChartCanvas');
  if (!canvas || typeof Chart === 'undefined') return;
  const catTotals = {};
  transactions.forEach(t => (t.items||[]).forEach(i => {
    const p = products.find(x => x.id === i.productId);
    const cat = p?.category || 'other';
    catTotals[cat] = (catTotals[cat]||0) + (i.price * i.qty);
  }));
  const labels = Object.keys(catTotals); const data = Object.values(catTotals);
  const colors = ['#3b82f6','#22d3ee','#8b5cf6','#10b981','#f59e0b'];
  if (window.__catChart) window.__catChart.destroy();
  window.__catChart = new Chart(canvas.getContext('2d'), {
    type:'doughnut',
    data:{labels:labels.length?labels:['No data'],datasets:[{data:data.length?data:[1],backgroundColor:labels.length?colors.slice(0,labels.length):['#1e3a5f'],borderColor:'#0c1a33',borderWidth:4,hoverOffset:8}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'bottom',labels:{color:'#94a3b8',padding:16,font:{size:12,weight:'600'},usePointStyle:true,pointStyle:'circle'}},tooltip:{backgroundColor:'#0c1a33',borderColor:'#3b82f6',borderWidth:1,padding:12,callbacks:{label:c=>'  '+c.label+': $'+c.parsed.toFixed(2)}}}}
  });
}

/* =====================================================
   REAL-TIME BARCODE SCANNER
   ===================================================== */
function openScanner(mode = 'realtime') {
  scannerMode = mode;
  scannerTarget = mode === 'assign' ? 'assign' : null;

  document.getElementById('scannerModal').classList.add('open');
  document.getElementById('scanHistory').innerHTML = '<div class="empty-state">No scans yet</div>';
  scanHistory = [];
  lastScannedCode = null;
  lastScannedAt = 0;

  const status = document.getElementById('scannerStatus');
  const video = document.getElementById('scannerVideo');

  if (!window.ZXing) {
    status.textContent = '⚠️ Scanner library not loaded. Use manual entry below.';
    return;
  }

  // Initialize ZXing reader
  scanner = new ZXing.BrowserMultiFormatReader();
  scannerActive = true;
  status.textContent = '🎥 Starting camera…';
  status.classList.remove('active');

  scanner.decodeFromVideoDevice(null, 'scannerVideo', (result, err) => {
    if (!scannerActive) return;

    if (result) {
      const code = result.getText();
      const now = Date.now();

      // Debounce: ignore same barcode within 2 seconds
      if (code === lastScannedCode && (now - lastScannedAt) < 2000) return;

      lastScannedCode = code;
      lastScannedAt = now;

      status.textContent = `✅ Scanned: ${code}`;
      status.classList.add('active');
      beep(1200, 80);

      // Add to history
      const product = products.find(p => p.barcode === code || p.id === code);
      scanHistory.unshift({
        code,
        found: !!product,
        productName: product?.name || 'Not in inventory',
        productId: product?.id,
        timestamp: now
      });
      if (scanHistory.length > 20) scanHistory.pop();
      renderScanHistory();

      // Handle based on mode
      if (scannerMode === 'assign') {
        // Assign barcode to product being edited
        document.getElementById('editBarcode').value = code;
        toast(`Barcode assigned: ${code}`, 'success');
        closeScanner();
        return;
      }

      // Real-time mode: highlight matching product row
      if (product) {
        highlightProductRow(product.id);

        // Auto-scroll to inventory view if not already there
        if (!document.querySelector('#view-inventory.active')) {
          switchView('inventory');
          setTimeout(() => highlightProductRow(product.id), 300);
        }
      } else {
        toast(`Not in inventory: ${code}`, 'warning', 2500);
      }
    }
  }).catch(e => {
    console.error('[ElectroPOS] Scanner error:', e);
    status.textContent = '⚠️ Camera unavailable. Use manual entry below.';
  });
}

function closeScanner() {
  document.getElementById('scannerModal').classList.remove('open');
  scannerActive = false;
  if (scanner) {
    try { scanner.reset(); } catch (e) {}
    scanner = null;
  }
  const video = document.getElementById('scannerVideo');
  if (video && video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  document.getElementById('manualBarcode').value = '';
  const status = document.getElementById('scannerStatus');
  status.classList.remove('active');
}

function manualLookup(code) {
  const product = products.find(p => p.barcode === code || p.id === code);
  scanHistory.unshift({
    code,
    found: !!product,
    productName: product?.name || 'Not in inventory',
    productId: product?.id,
    timestamp: Date.now()
  });
  if (scanHistory.length > 20) scanHistory.pop();
  renderScanHistory();

  if (scannerMode === 'assign') {
    document.getElementById('editBarcode').value = code;
    toast(`Barcode assigned: ${code}`, 'success');
    closeScanner();
    return;
  }

  if (product) {
    beep(1200, 80);
    toast(`Found: ${product.name}`, 'success');
    if (!document.querySelector('#view-inventory.active')) switchView('inventory');
    setTimeout(() => highlightProductRow(product.id), 200);
  } else {
    beep(300, 200);
    toast(`Not found: ${code}`, 'warning');
  }

  document.getElementById('manualBarcode').value = '';
}

function renderScanHistory() {
  const container = document.getElementById('scanHistory');
  if (scanHistory.length === 0) {
    container.innerHTML = '<div class="empty-state">No scans yet</div>';
    return;
  }
  container.innerHTML = scanHistory.map(s => `
    <div class="row ${s.found ? 'found' : 'notfound'}">
      <span class="code">${escapeHtml(s.code)}</span>
      <span class="time">${s.found ? '✓ ' + escapeHtml(s.productName) : '✗ not found'} · ${new Date(s.timestamp).toLocaleTimeString()}</span>
    </div>`).join('');
}

/* =====================================================
   EXPORT
   ===================================================== */
function exportCSV() {
  if (transactions.length === 0) { toast('No transactions', 'warning'); return; }
  const rows = [['Date','Staff','Items','Total','Status']];
  transactions.forEach(t => {
    rows.push([
      t.timestamp ? new Date(t.timestamp).toISOString() : '',
      t.staff || '',
      (t.items||[]).map(i => `${i.name} x${i.qty}`).join(' | '),
      (t.total||0).toFixed(2),
      t.status || 'completed'
    ]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `electropos-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV exported', 'success');
}

/* =====================================================
   AUTH — LOOP-PROOF
   ===================================================== */
onAuthStateChanged(auth, async (user) => {
  authResolved = true;
  console.log('[ElectroPOS] Auth state:', user ? user.email : 'signed out');

  if (!user) {
    authHandlerRan = false; shellRendered = false; signOutInProgress = false;
    currentUser = null; products = []; transactions = []; users = {};
    if (!document.querySelector('.login-card')) renderLogin();
    return;
  }

  if (authHandlerRan && shellRendered) return;
  authHandlerRan = true;

  const displayName = user.displayName
    || (user.email || '').split('@')[0].replace(/[._-]/g, ' ').replace(/\b\w/g, c => c.toUpperCase())
    || 'Admin';

  currentUser = { uid: user.uid, email: user.email || '', name: displayName, role: 'admin' };

  const emailIsAdmin = ADMIN_EMAILS.map(e => e.toLowerCase().trim()).includes((user.email || '').toLowerCase().trim());
  console.log('[ElectroPOS] Email in whitelist:', emailIsAdmin);

  try {
    const usersSnap = await get(ref(db, 'users'));
    users = usersSnap.val() || {};
    const me = users[user.uid];
    const dbRole = me?.role;
    if (dbRole === 'admin' || emailIsAdmin) currentUser.role = 'admin';
    else if (dbRole === 'staff') currentUser.role = 'staff';
    else currentUser.role = null;
    if (me?.name) currentUser.name = me.name;
  } catch (e) {
    console.warn('[ElectroPOS] Could not read users:', e.message);
    users = {};
    currentUser.role = emailIsAdmin ? 'admin' : null;
  }

  if (currentUser.role !== 'admin') {
    if (signOutInProgress) return;
    signOutInProgress = true;
    toast('Access denied: admin only', 'error', 3000);
    try { await signOut(auth); } catch (e) {}
    return;
  }

  if (shellRendered) return;
  shellRendered = true;

  try {
    setupListeners();
    renderShell();
    console.log('[ElectroPOS] ✅ Shell rendered');
  } catch (e) {
    console.error('[ElectroPOS] Shell crash:', e);
    renderFatal('Dashboard Crashed', 'Refresh to retry.', e.message + '\n' + (e.stack || ''));
  }
});

/* =====================================================
   LIVE LISTENERS
   ===================================================== */
function setupListeners() {
  onValue(ref(db, 'products'), (s) => {
    const data = s.val() || {};
    products = Object.entries(data).map(([id, val]) => ({ id, ...val }));
    if (shellRendered) { renderProducts(); renderStats(); }
  });

  onValue(ref(db, 'transactions'), (s) => {
    const data = s.val() || {};
    transactions = Object.entries(data).map(([id, val]) => {
      let ts = val.timestamp;
      if (ts && typeof ts === 'object' && ts['.sv'] === 'timestamp') ts = Date.now();
      return { id, ...val, timestamp: ts || Date.now() };
    }).sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
    if (shellRendered) {
      renderTransactions(); renderStats(); renderAnalytics(); renderStaff();
      if (document.querySelector('#view-users.active')) renderUsers();
    }
  });

  onValue(ref(db, 'users'), (s) => {
    users = s.val() || {};
    if (shellRendered && document.querySelector('#view-users')) renderUsers();
  });
}
